<!--
  GoF 4/6 — Composite · Facade · Bridge · Flyweight 판별 explainer (68초, 16:9, 무음 + VO 대본 별도).
  주인공: 호텔 한 채. 같은 호텔이 네 가지 질문에 답한다.
    Composite : 호텔 → 층 → 객실 트리, 모두 같은 count()로 합계가 올라온다
    Facade    : 로비 컨시어지 — 벨 한 번에 식당·택시·공연이 순서대로 (직접 가는 길도 열려 있다)
    Bridge    : 객실의 리모컨 ↔ TV를 잇는 다리(device 필드) + 클래스 수 계기판 (곱하기 → 더하기)
    Flyweight : 호텔 옥상에서 내려다본 숲 — 나무 1만 그루가 모델 하나를 공유
    리캡      : 판별 레일 ① 같은 타입 목록? ② 새 창구? ③ 양쪽 계층 확장? ④ 공유 캐시?
  더블클릭으로 열기. 자동재생 + 루프, R 다시, Space 일시정지. ?debug=1 스크럽, ?clean=1 export용.
  모든 시각 요소는 tl.time()의 순수 함수.
-->
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>

html,body{margin:0;height:100%;background:#0d1417;overflow:hidden}

.view{position:absolute;inset:0}

    <div class="say" id="s5" style="left:0;right:0;text-align:center;top:850px;font-size:104px;--c:var(--violet)"><span class="wd">곱하기를</span> <span class="wd hl"><i></i>더하기로</span></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const W=1920,H=1080,DUR=68;
const INK='#1F2A37',GREEN='#4C9A2A',AMBER='#E09A12',VIOLET='#8B4FD8',SKY='#1E8FD8',LIT='#FFD34E',DARKWIN='#3A4A5E';
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',defs=$('#defs');

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const backOut=x=>{const c=1.70158,u=x-1;return 1+(c+1)*u*u*u+c*u*u;};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
let uid=0;
const tl=gsap.timeline({paused:true});

/* ---------- prop: SVG 그룹 변환을 수동으로 쓴다 ---------- */
const props=[];

/* ---------- 카메라 ---------- */
const cams=[];
function cam(g,z,cx,cy){const c={g,z,cx,cy,z0:z,cx0:cx,cy0:cy};cams.push(c);return c;}
const shot=(c,at,dur,z,cx,cy,ease='power2.inOut')=>tl.to(c,{z,cx,cy,duration:dur,ease},at);
const cutTo=(c,at,z,cx,cy)=>tl.set(c,{z,cx,cy},at);
/* ---------- 방향성 모션 블러 ---------- */
const blurs=[],blurMap=new Map();
function blurOf(el,axis='y'){if(blurMap.has(el))return blurMap.get(el);const id='mb'+(uid++);
  const f=S('filter',{id,x:'-40%',y:'-80%',width:'180%',height:'260%'},defs),g=S('feGaussianBlur',{stdDeviation:'0 0'},f);
  const b={el,g,id,axis,v:0};blurs.push(b);blurMap.set(el,b);return b;}

/* ================= 공용 부품 ================= */
function drawHand(p,dir=1,point=false,label='Client'){
  const g=S('g',{},p),m=S('g',{transform:`scale(${dir} 1)${point?' translate(-62 0)':''}`},g);
  S('rect',{x:-1700,y:-40,width:1560,height:80,fill:'#55657A',stroke:INK,'stroke-width':7},m);
  S('rect',{x:-160,y:-52,width:44,height:104,rx:10,fill:'#fff',stroke:INK,'stroke-width':7},m);
  S('rect',{x:-120,y:-56,width:120,height:112,rx:46,fill:'#fff',stroke:INK,'stroke-width':7},m);
  if(point)S('rect',{x:-16,y:-15,width:78,height:30,rx:15,fill:'#fff',stroke:INK,'stroke-width':7},m);
  else S('path',{d:'M-66 -56 C-46 -90 -8 -84 -6 -54',fill:'#fff',stroke:INK,'stroke-width':7},m);
  if(label)T(label,dir*(-620-(point?62:0)),13,{class:'mono','font-size':36,'text-anchor':'middle',fill:'#fff'},g);
  return g;}
function sparks(p,n=8,r0=40,r1=80){const g=S('g',{},p);for(let k=0;k<n;k++){const a=Math.PI*2*k/n;S('line',{x1:Math.cos(a)*r0,y1:Math.sin(a)*r0,x2:Math.cos(a)*r1,y2:Math.sin(a)*r1,stroke:INK,'stroke-width':7,'stroke-linecap':'round'},g);}return g;}
/* 알약 라벨: 원점 = 중심 */
function pill(p,txt,{fill='#fff',color=INK,stroke=INK,font='plex',size=34,w,x=0,y=0,o=0,s=0}={}){const g=S('g',{},p);
  const ww=w||txt.length*size*(font==='mono'?.62:.9)+56;
  S('rect',{x:-ww/2+7,y:-34+7,width:ww,height:68,rx:16,fill:INK},g);S('rect',{x:-ww/2,y:-34,width:ww,height:68,rx:16,fill,stroke,'stroke-width':5},g);
  T(txt,0,size*.36,{class:font,'font-size':size,'text-anchor':'middle',fill:color},g);return prop(g,{x,y,s,o});}
function treeTop(p,r=34){const g=S('g',{},p);S('circle',{cx:6,cy:7,r,fill:INK,opacity:.9},g);S('circle',{r,fill:'#3F7F3A',stroke:INK,'stroke-width':5},g);S('circle',{cx:-8,cy:-8,r:r*.5,fill:'#5FA052'},g);return g;}

/* ---------- 타임라인 헬퍼 ---------- */
const show=(el,at,d=.25)=>tl.to(el,{opacity:1,duration:d},at), hide=(el,at,d=.25)=>tl.to(el,{opacity:0,duration:d},at);
const pop=(p,at,{d=.6,from=0,ease='back.out(1.8)'}={})=>tl.fromTo(p,{s:from,o:0},{s:1,o:1,duration:d,ease,immediateRender:false},at);
const bump=(p,at)=>tl.to(p,{s:1.12,duration:.12,yoyo:true,repeat:1,ease:'sine.inOut'},at);
function say(id,at,st=.09){const el=$(id),w=el.querySelectorAll('.wd'),b=blurOf(el);
  tl.fromTo(w,{opacity:0,yPercent:70,scaleY:1.35},{opacity:1,yPercent:0,scaleY:1,duration:.8,ease:'power4.out',stagger:st,immediateRender:false},at);
  tl.fromTo(b,{v:20},{v:0,duration:.8+st*(w.length-1),ease:'power3.out',immediateRender:false},at);
  el.querySelectorAll('.hl i').forEach(i=>tl.fromTo(i,{scaleX:0},{scaleX:1,duration:.5,ease:'power3.out',immediateRender:false},at+.3+st*w.length));}
function unsay(id,at){const el=$(id),w=el.querySelectorAll('.wd'),b=blurOf(el);
  tl.to(w,{opacity:0,yPercent:-60,duration:.4,ease:'power2.in',stagger:.025},at);
  tl.fromTo(b,{v:0},{v:16,duration:.45,ease:'power2.in',immediateRender:false},at);tl.set(b,{v:0},at+.55);}
function chipIn(id,at){const el=$(id),b=blurOf(el,'x');
  tl.fromTo(el,{opacity:0,x:90},{opacity:1,x:0,duration:.6,ease:'power4.out',immediateRender:false},at);
  tl.fromTo(b,{v:24},{v:0,duration:.6,ease:'power3.out',immediateRender:false},at);}
const chipOut=(id,at)=>tl.to($(id),{opacity:0,x:70,duration:.35,ease:'power2.in'},at);
const flood=(id,at)=>tl.fromTo(id,{scale:0},{scale:1,duration:1.1,ease:'power2.inOut',immediateRender:false},at);
function whip(t,from,to,dir=1){const bf=blurOf($(from)),bt=blurOf($(to));
  tl.to(from,{y:-150*dir,duration:.28,ease:'power2.in'},t);tl.fromTo(bf,{v:0},{v:24,duration:.28,ease:'power2.in',immediateRender:false},t);
  tl.set(from,{visibility:'hidden'},t+.28);tl.set(to,{visibility:'visible',y:150*dir},t+.28);tl.set(bt,{v:24},t+.28);
  tl.to(to,{y:0,duration:.42,ease:'power3.out'},t+.28);tl.to(bt,{v:0,duration:.42,ease:'power3.out'},t+.28);
  tl.set(from,{y:0},t+.3);tl.set(bf,{v:0},t+.3);}
function rack(t,from,to){const bf=blurOf($(from),'xy'),bt=blurOf($(to),'xy');
  tl.to(from,{scale:.86,opacity:0,duration:.7,ease:'power2.in'},t);tl.fromTo(bf,{v:0},{v:16,duration:.7,ease:'power2.in',immediateRender:false},t);
  tl.set(to,{visibility:'visible',scale:1.18,opacity:0},t+.4);tl.set(bt,{v:16},t+.4);
  tl.to(to,{scale:1,opacity:1,duration:.85,ease:'power3.out'},t+.4);tl.to(bt,{v:0,duration:.85,ease:'power3.out'},t+.4);
  tl.set(from,{visibility:'hidden'},t+.7);tl.set(bf,{v:0},t+.7);}
/* 그어지는 선: 원점→끝 방향으로 dashoffset */
function drawLine(d,p,a){const e=S('path',{d,fill:'none','stroke-linecap':'round',...a},p);const L=e.getTotalLength();e.setAttribute('stroke-dasharray',L);e.setAttribute('stroke-dashoffset',L);return {e,L};}
const draw=(ln,at,dur=.5,ease='power2.inOut')=>tl.to(ln.e,{attr:{'stroke-dashoffset':0},duration:dur,ease},at);

/* ================= VIEW 1: 호텔 외관 ================= */
const extCam=S('g',{},$('#extSvg')),CE=cam(extCam,1.55,960,300);
S('rect',{x:-900,y:860,width:3720,height:700,fill:'#DCEACF'},extCam);S('rect',{x:-900,y:856,width:3720,height:8,fill:INK,opacity:.18},extCam);
S('path',{d:'M900 860 L1020 860 L1120 1100 L800 1100 Z',fill:'#EFE6D2'},extCam);
for(const [x,r] of [[150,70],[300,54],[1640,62],[1790,74]]){S('rect',{x:x-10,y:860-r-60,width:20,height:r+60,fill:'#7A5236',stroke:INK,'stroke-width':4},extCam);
  S('circle',{cx:x+8,cy:860-r-70+8,r,fill:INK},extCam);S('circle',{cx:x,cy:860-r-70,r,fill:'#5FA052',stroke:INK,'stroke-width':6},extCam);}
S('rect',{x:634,y:314,width:680,height:560,rx:20,fill:INK},extCam);
S('rect',{x:620,y:300,width:680,height:560,rx:20,fill:'#fff',stroke:INK,'stroke-width':8},extCam);
S('rect',{x:880,y:178,width:160,height:92,rx:12,fill:'#fff',stroke:INK,'stroke-width':7},extCam);
S('rect',{x:922,y:198,width:76,height:52,rx:8,fill:LIT,stroke:INK,'stroke-width':5},extCam);
S('rect',{x:600,y:256,width:720,height:62,rx:16,fill:INK},extCam);
T('HOTEL',960,302,{class:'plex','font-size':44,'text-anchor':'middle',fill:'#fff','letter-spacing':'.3em'},extCam);
S('line',{x1:624,y1:470,x2:1296,y2:470,stroke:INK,'stroke-width':6},extCam);S('line',{x1:624,y1:640,x2:1296,y2:640,stroke:INK,'stroke-width':6},extCam);
const FLOORS=[[350,[1,0,1,1]],[510,[1,0,0,1]]],WX=[670,820,970,1120];
for(const [y,lit] of FLOORS)lit.forEach((l,i)=>S('rect',{x:WX[i],y,width:110,height:100,rx:10,fill:l?LIT:DARKWIN,stroke:INK,'stroke-width':6},extCam));
for(const x of [680,1120])S('rect',{x,y:690,width:120,height:90,rx:10,fill:'#DDEFF0',stroke:INK,'stroke-width':6},extCam);
const door=S('rect',{x:890,y:690,width:140,height:170,rx:12,fill:AMBER,stroke:INK,'stroke-width':7},extCam);
S('circle',{cx:1005,cy:780,r:7,fill:INK},extCam);
const extFront=S('g',{},extCam);
const QC=[['트리로 묶기',GREEN,'#fff',330,420],['창구 하나',AMBER,INK,330,640],['두 갈래로',VIOLET,'#fff',1590,420],['공유로 아끼기',SKY,'#fff',1590,640]]
  .map(([t,f,c,x,y])=>({p:pill(extFront,t,{fill:f,color:c,size:42,w:380,x,y}),x}));
const badgeExt=pill(extFront,'count() = 1',{font:'mono',fill:'#fff',color:GREEN,size:34,x:455,y:400});

/* ================= VIEW 2: 트리 — 호텔 → 층 → 객실 ================= */
const treeCam=S('g',{},$('#treeSvg')),CTR=cam(treeCam,1.3,960,450);
const tEdges=S('g',{},treeCam),tNodes=S('g',{},treeCam);
const ROOT=[960,190],F3=[560,450],F2=[1260,450],PH=[1660,450];
const ROOMS=[[380,1],[500,0],[620,1],[740,1]].map(([x,v])=>({x,v,par:F3})).concat([[1080,1],[1200,0],[1320,0],[1440,1]].map(([x,v])=>({x,v,par:F2})));
function edge(a,b){S('path',{d:`M${a[0]} ${a[1]} L${b[0]} ${b[1]}`,stroke:INK,'stroke-width':6},tEdges);
  return drawLine(`M${a[0]} ${a[1]} L${b[0]} ${b[1]}`,tEdges,{stroke:GREEN,'stroke-width':12});}   // 자식 → 부모 방향으로 빛남
const eRooms=ROOMS.map(r=>edge([r.x,760],r.par)),eF3=edge(F3,ROOT),eF2=edge(F2,ROOT),ePH=edge(PH,ROOT);
const edgeBase=[...tEdges.querySelectorAll('path[stroke="'+INK+'"]')];edgeBase.forEach(e=>e.setAttribute('style','opacity:0'));
function nodeBox(p,[x,y],w,h,fill,txt,col){const g=S('g',{},p);S('rect',{x:-w/2+8,y:-h/2+8,width:w,height:h,rx:18,fill:INK},g);
  S('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:18,fill,stroke:INK,'stroke-width':7},g);T(txt,0,13,{class:'plex','font-size':40,'text-anchor':'middle',fill:col},g);return prop(g,{x,y,s:0,o:0});}

pop(pL,37.4,{from:.8});pop(pR,37.5,{from:.8});numsG.forEach(e=>show(e,37.7,.3));show(plusT,37.7,.3);
const at1=37.8,at2=39.3,at3=40.8;
GL.forEach(b=>{const at=b.r<2&&b.c<2?at1+(b.r*2+b.c)*.08:b.c===2&&b.r<2?at2+b.r*.1:at3+b.c*.1;pop(b.p,at,{d:.45});});
[RR[0],RR[1],RT[0],RT[1]].forEach((b,k)=>pop(b,at1+k*.08,{d:.45}));pop(RT[2],at2,{d:.45});pop(RR[2],at3,{d:.45});
tl.to(cntL,{v:4,duration:.4},at1);tl.to(cntR,{v:4,duration:.4},at1);tl.to(cntL,{v:6,duration:.4},at2);tl.to(cntR,{v:5,duration:.4},at2);tl.to(cntL,{v:9,duration:.4},at3);tl.to(cntR,{v:6,duration:.4},at3);
say('#s5',41.8);
unsay('#s5',44.6);chipOut('#chB',44.8);
/* --- 45–57 Flyweight --- */
whip(45.0,'#room','#forest',1);flood('#fl4',45.2);
cutTo(CF,45.0,1.6,960,560);shot(CF,45.4,1.4,1,960,540);
chipIn('#chW',46.0);
pop(gauge,46.4,{from:.7});show(memT,46.6,.2);pop(treeCount,46.6,{from:.6});
tl.to(mem,{v:10000,duration:1.8,ease:'power1.inOut'},46.8);
pop(cardP,49.0);
tl.to(mem,{v:1,duration:1.0,ease:'power3.inOut'},49.4);tl.set(memT,{attr:{fill:SKY}},50.3);
shot(CF,51.0,.9,1.85,(CARD[0]+tgt.x)/2,(CARD[1]+tgt.y)/2+10);
pop(intL,51.8,{from:.6});pop(ring,52.0,{from:.5});pop(extL,52.1,{from:.6});
tl.to([intL,extL,ring],{o:0,duration:.3},53.0);
shot(CF,53.2,.9,1,960,540);
say('#s6',53.6);
unsay('#s6',56.4);chipOut('#chW',56.6);
/* --- 57–68 판별 레일 --- */
whip(56.8,'#forest','#rail',1);flood('#fl5',57.0);
cutTo(CRL,56.8,1.2,400,700);
gates.forEach((g,k)=>pop(g.p,57.4+k*.12));dests.forEach((d,k)=>pop(d,57.6+k*.12));
shot(CRL,58.0,1.8,1,960,560,'sine.inOut');
cards.forEach((c,k)=>{const at=58.2+k*1.3;tl.set(c,{p:0,o:0},0);tl.set(c,{o:1},at);
  tl.fromTo(c,{p:0},{p:1,duration:1.2,ease:'sine.inOut',immediateRender:false},at);tl.to(c,{o:0,duration:.25},at+1.2);
  tl.fromTo(dests[k],{s:1.18},{s:1,duration:.45,ease:'power2.out',immediateRender:false},at+1.2);});
{const br=blurOf($('#rail'),'xy');tl.to('#rail',{opacity:.2,duration:.6},63.6);tl.fromTo(br,{v:0},{v:8,duration:.6,immediateRender:false},63.6);}
say('#s7',63.8,.08);
unsay('#s7',67.2);
tl.to({},{duration:.01},DUR-.01);

/* ================= render: tl.time()의 순수 함수 ================= */
const grid=$('#grid'),bl1=$('#bl1'),bl2=$('#bl2');
const viewCam={ext:CE,tree:CTR,lobby:CL,room:CR,forest:CF,rail:CRL};
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function render(){const t=tl.time();
  for(const p of props){p.el.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.r}) scale(${p.s})`);p.el.setAttribute('opacity',p.o);}
  for(const c of cams){const z=c.z*(1+.006*Math.sin(t*.9));c.g.setAttribute('transform',`translate(960 540) scale(${z}) translate(${-c.cx} ${-c.cy})`);}
  for(const b of blurs){if(b.v>.25){b.g.setAttribute('stdDeviation',b.axis==='y'?`${b.v*.12} ${b.v}`:b.axis==='x'?`${b.v} ${b.v*.08}`:`${b.v} ${b.v}`);b.el.style.filter=`url(#${b.id})`;}else b.el.style.filter='none';}
  let cz=1;for(const k in viewCam)if(document.getElementById(k).style.visibility!=='hidden'){cz=viewCam[k].z;break;}
  grid.style.transform=`scale(${(1+.022*Math.sin(t*.8))*(1+(cz-1)*.18)}) translate(${Math.sin(t*.21)*18}px,${Math.cos(t*.17)*14}px)`;
  bl1.style.transform=`translate(${Math.sin(t*.31)*90}px,${Math.cos(t*.27)*60}px)`;bl2.style.transform=`translate(${Math.cos(t*.23)*80}px,${Math.sin(t*.29)*70}px)`;
  /* 계기판 숫자 */
  numL.textContent=Math.round(cntL.v);numR.textContent=Math.round(cntR.v);memT.textContent=fmt(mem.v)+' MB';
  /* 숲: 나무가 거리 순으로 돋아나고, 각자 모델(흰 상자)을 들었다가, 공유 모델 하나에 연결된다 */
  for(const tr of trees){const u=(t-tr.tPop)/.35,s=u<=0?0:u>=1?1:backOut(u),sw=1+.03*Math.sin(t*1.3+tr.x*.01);
    tr.g.setAttribute('transform',`translate(${tr.x} ${tr.y}) scale(${s*sw})`);
    const hasBox=t>=tr.tBox&&t<tr.tGone;tr.box.setAttribute('opacity',hasBox?1:0);
    tr.ln.setAttribute('opacity',clamp((t-tr.tGone)/.3)*.5);}
  /* 판별 레일 */
  for(const c of cards){const tr=trails[c.k];tr.e.setAttribute('stroke-dashoffset',tr.L*(1-c.p));
    const pt=c.path.getPointAtLength(c.L*c.p);c.g.setAttribute('transform',`translate(${pt.x} ${pt.y-64})`);c.g.setAttribute('opacity',c.o);}
  for(const [gi,g] of gates.entries()){let lit=false;for(const c of cards){if(c.o<=0||c.k<gi)continue;if(Math.abs(c.p*c.L-g.len)<70)lit=true;}g.c.setAttribute('fill',lit?LIT:'#fff');}
}
gsap.ticker.add(render);

/* ---------- 컨트롤: 자동재생 + 루프, 플레이어 없음. ?debug=1 스크럽, ?clean=1 export ---------- */
const q=new URLSearchParams(location.search);
const start=()=>tl.play(0);
tl.eventCallback('onComplete',start);
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);render();},play:start};
window.OPENER.seekFrame=t=>{window.OPENER.seek(t);return Promise.resolve();};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
  gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
document.fonts.ready.then(()=>{render();window.OPENER.ready=true;if(!q.has('clean'))start();});
</script>
