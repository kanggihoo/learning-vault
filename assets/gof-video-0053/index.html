<!--
  GoF 5/6 — Iterator · Visitor · Memento · Interpreter 판별 explainer (64초, 16:9, 무음 + VO 대본 별도).
  주인공: 한 골목의 집들(객체 구조). 상자(컬렉션)에서 하나씩 꺼내 골목을 세우고(Iterator),
  집은 그대로 둔 채 방문자가 돌며 일하고(Visitor), 한 집의 간판 상태를 봉투로 저장·복원하고(Memento),
  마지막엔 수식이 문법 트리로 서서 해석된다(Interpreter). 리캡은 판별 레일.
  더블클릭으로 열기. 자동재생 + 루프, R 다시, Space 일시정지. ?debug=1 스크럽, ?clean=1 export용.
  모든 시각 요소는 tl.time()의 순수 함수 (Date.now/Math.random 없음).
-->
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A37;--base:#EEF7F5;--amber:#E8A317;--violet:#7C4DFF;--sky:#1E88E5;--magenta:#C2255C}
html,body{margin:0;height:100%;background:#0d1417;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--base);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif}
#bg{position:absolute;inset:0;overflow:hidden}
.flood{position:absolute;width:4800px;height:4800px;border-radius:50%;transform:scale(0)}
#grid{position:absolute;inset:-240px;background-image:linear-gradient(rgba(31,42,55,.075) 2px,transparent 2px),linear-gradient(90deg,rgba(31,42,55,.075) 2px,transparent 2px);background-size:80px 80px;background-position:center}
.blob{position:absolute;border-radius:50%;width:1300px;height:1300px;background:radial-gradient(circle,rgba(255,255,255,.8),rgba(255,255,255,0) 65%)}
.view{position:absolute;inset:0}
.view svg,#hud{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.plex{font-family:'IBM Plex Sans KR',sans-serif;font-weight:600}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
#ui{position:absolute;inset:0;pointer-events:none}
.say{position:absolute;font-family:'Do Hyeon',sans-serif;line-height:1.12;letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.say .wd{display:inline-block;opacity:0;transform-origin:50% 100%}
.hl{position:relative}
.hl i{position:absolute;left:-.14em;right:-.14em;top:.0em;bottom:-.02em;border:.05em solid var(--c,var(--ink));border-radius:.14em;transform:scaleX(0);transform-origin:0 50%}
.chip{position:absolute;right:64px;top:54px;padding:8px 30px 12px;border-radius:44px;color:#fff;font:600 42px 'IBM Plex Sans KR',sans-serif;opacity:0;border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(95% 95% at 50% 50%,transparent 62%,rgba(31,42,55,.16))}
#dbg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;gap:12px;align-items:center;padding:10px 16px;border-radius:14px;background:rgba(14,16,22,.9);color:#cfd5e3;font:13px system-ui;z-index:50}
#dbg input{width:420px}#dbg span{font-variant-numeric:tabular-nums;min-width:6ch}
</style>

<body>

    <div class="say" id="s3" style="left:110px;top:70px;font-size:100px;--c:var(--violet)"><span class="wd">집은</span> <span class="wd">그대로,</span> <span class="wd hl"><i></i>연산이</span> <span class="wd">방문한다</span></div>
    <div class="say" id="s4" style="left:110px;top:40px;font-size:104px;--c:var(--sky)"><span class="wd">저장했다가</span> <span class="wd hl"><i></i>되돌린다</span></div>
    <div class="say" id="s5" style="left:1210px;top:600px;font-size:108px;--c:var(--magenta)"><span class="wd">문법을</span><br><span class="wd hl"><i></i>트리로</span> <span class="wd">해석</span></div>
    <div class="say" id="s6" style="left:0;right:0;text-align:center;top:330px;font-size:112px;--c:var(--ink)"><span class="wd" style="color:var(--amber)">꺼내기</span> <span class="wd" style="color:var(--violet)">방문</span> <span class="wd" style="color:var(--sky)">저장</span> <span class="wd" style="color:var(--magenta)">해석</span><br><span class="wd hl"><i></i>질문이</span> <span class="wd">패턴을</span> <span class="wd">고른다</span></div>
    <div class="chip" id="chI" style="background:var(--amber);color:var(--ink)">Iterator</div>
    <div class="chip" id="chV" style="background:var(--violet)">Visitor</div>
    <div class="chip" id="chM" style="background:var(--sky)">Memento</div>
    <div class="chip" id="chN" style="background:var(--magenta)">Interpreter</div>
  </div>
  <div id="dbg"><button id="dPlay">Pause</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const W=1920,H=1080,DUR=64;
const INK='#1F2A37',AMBER='#E8A317',VIOLET='#7C4DFF',SKY='#1E88E5',MAG='#C2255C',GRAY='#C5CFCC',LIT='#FFD34E',ROOF='#F2E6CF',RED='#D9483B',OK='#3FBF5A';
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',defs=$('#defs');
function S(tag,a={},p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const T=(txt,x,y,a,p)=>{const e=S('text',{x,y,...a},p);e.textContent=txt;return e;};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
let uid=0;
const tl=gsap.timeline({paused:true});

/* ---------- 엔진 (0049와 동일) ---------- */
const props=[];
function prop(el,i={}){const p={el,x:0,y:0,s:1,r:0,o:1,...i};props.push(p);return p;}
const cams=[];
function cam(g,z,cx,cy){const c={g,z,cx,cy,z0:z,cx0:cx,cy0:cy};cams.push(c);return c;}
const shot=(c,at,dur,z,cx,cy,ease='power2.inOut')=>tl.to(c,{z,cx,cy,duration:dur,ease},at);
const cutTo=(c,at,z,cx,cy)=>tl.set(c,{z,cx,cy},at);
const blurs=[],blurMap=new Map();
function blurOf(el,axis='y'){if(blurMap.has(el))return blurMap.get(el);const id='mb'+(uid++);
  const f=S('filter',{id,x:'-40%',y:'-80%',width:'180%',height:'260%'},defs),g=S('feGaussianBlur',{stdDeviation:'0 0'},f);
  const b={el,g,id,axis,v:0};blurs.push(b);blurMap.set(el,b);return b;}
const show=(el,at,d=.25)=>tl.to(el,{opacity:1,duration:d},at), hide=(el,at,d=.25)=>tl.to(el,{opacity:0,duration:d},at);
const pop=(p,at,{d=.6,from=0,ease='back.out(1.8)'}={})=>tl.fromTo(p,{s:from,o:0},{s:1,o:1,duration:d,ease,immediateRender:false},at);
const fade=(p,at,d=.3)=>tl.to(p,{o:0,duration:d},at);
function say(id,at,st=.09){const el=$(id),w=el.querySelectorAll('.wd'),b=blurOf(el);
  tl.fromTo(w,{opacity:0,yPercent:70,scaleY:1.35},{opacity:1,yPercent:0,scaleY:1,duration:.8,ease:'power4.out',stagger:st,immediateRender:false},at);
  tl.fromTo(b,{v:20},{v:0,duration:.8+st*(w.length-1),ease:'power3.out',immediateRender:false},at);
  el.querySelectorAll('.hl i').forEach(i=>tl.fromTo(i,{scaleX:0},{scaleX:1,duration:.5,ease:'power3.out',immediateRender:false},at+.3+st*w.length));}
function unsay(id,at){const el=$(id),w=el.querySelectorAll('.wd'),b=blurOf(el);
  tl.to(w,{opacity:0,yPercent:-60,duration:.4,ease:'power2.in',stagger:.025},at);
  tl.fromTo(b,{v:0},{v:16,duration:.45,ease:'power2.in',immediateRender:false},at);tl.set(b,{v:0},at+.55);}
function chipIn(id,at){const el=$(id),b=blurOf(el,'x');
  tl.fromTo(el,{opacity:0,x:90},{opacity:1,x:0,duration:.6,ease:'power4.out',immediateRender:false},at);
  tl.fromTo(b,{v:24},{v:0,duration:.6,ease:'power3.out',immediateRender:false},at);}
const chipOut=(id,at)=>tl.to($(id),{opacity:0,x:70,duration:.35,ease:'power2.in'},at);
const flood=(id,at)=>tl.fromTo(id,{scale:0},{scale:1,duration:1.1,ease:'power2.inOut',immediateRender:false},at);
function whip(t,from,to,dir=1){const bf=blurOf($(from)),bt=blurOf($(to));
  tl.to(from,{y:-150*dir,duration:.28,ease:'power2.in'},t);tl.fromTo(bf,{v:0},{v:24,duration:.28,ease:'power2.in',immediateRender:false},t);
  tl.set(from,{visibility:'hidden'},t+.28);tl.set(to,{visibility:'visible',y:150*dir},t+.28);tl.set(bt,{v:24},t+.28);
  tl.to(to,{y:0,duration:.42,ease:'power3.out'},t+.28);tl.to(bt,{v:0,duration:.42,ease:'power3.out'},t+.28);
  tl.set(from,{y:0},t+.3);tl.set(bf,{v:0},t+.3);}
/* 코드 칩 (월드 안의 오브젝트) */
function codeChip(p,txt,color,x,y,f=32){const w=Math.round(txt.length*f*.6)+56,g=S('g',{},p);
  S('rect',{x:-w/2+7,y:-34+7,width:w,height:68,rx:14,fill:INK},g);S('rect',{x:-w/2,y:-34,width:w,height:68,rx:14,fill:'#fff',stroke:INK,'stroke-width':5},g);
  T(txt,0,11,{class:'mono','font-size':f,'text-anchor':'middle',fill:color},g);return prop(g,{x,y,s:0,o:0});}
function pill(p,txt,bg,fg,x,y,{f=32,mono=true}={}){const w=Math.round(txt.length*f*(mono?.6:.95))+48,g=S('g',{},p);
  S('rect',{x:-w/2,y:-30,width:w,height:60,rx:30,fill:bg,stroke:INK,'stroke-width':5},g);
  T(txt,0,f*.36,{class:mono?'mono':'plex','font-size':f,'text-anchor':'middle',fill:fg},g);return prop(g,{x,y,s:0,o:0});}

/* ================= VIEW 1: 골목 (측면) ================= */
const stCam=S('g',{},$('#streetSvg')),CS=cam(stCam,1.15,700,600);
S('rect',{x:-800,y:830,width:4200,height:600,fill:'#CBD2CF'},stCam);
S('rect',{x:-800,y:790,width:4200,height:40,fill:'#E6E9E4',stroke:INK,'stroke-width':6},stCam);
const dashes=[];for(let i=0;i<40;i++)dashes.push(S('rect',{x:-800+i*120,y:956,width:64,height:12,rx:6,fill:'#fff',opacity:.8},stCam));
/* 상자 = 컬렉션. 안이 List인지 Tree인지 Hash인지 바깥에선 모른다 */
const crateG=S('g',{},stCam);
S('rect',{x:-190+12,y:-340+12,width:380,height:340,rx:18,fill:INK},crateG);
S('rect',{x:-190,y:-340,width:380,height:340,rx:18,fill:'#E3B778',stroke:INK,'stroke-width':8},crateG);
for(const y of [-255,-170,-85])S('line',{x1:-186,y1:y,x2:186,y2:y,stroke:INK,'stroke-width':4,opacity:.35},crateG);
S('rect',{x:150,y:-280,width:40,height:250,rx:8,fill:INK},crateG);
S('rect',{x:-135,y:-250,width:250,height:90,rx:14,fill:'#fff',stroke:INK,'stroke-width':5},crateG);
const crateTxt=T('List?',-10,-190,{class:'mono','font-size':44,'text-anchor':'middle',fill:INK},crateG);
const crate=prop(crateG,{x:380,y:790,s:1,o:1});
/* 집: 원점 = 바닥 중앙, 지붕 모양 = 요소 타입 */
const houses=[];
function drawHouse(p,type){const g=S('g',{},p);
  S('rect',{x:-130+10,y:-230+10,width:260,height:230,fill:INK},g);
  if(type==='Circle')S('path',{d:'M-150 -228 A150 125 0 0 1 150 -228 Z',fill:ROOF,stroke:INK,'stroke-width':7},g);
  if(type==='Square')S('rect',{x:-150,y:-310,width:300,height:84,rx:8,fill:ROOF,stroke:INK,'stroke-width':7},g);
  if(type==='Triangle')S('path',{d:'M-160 -228 L0 -372 L160 -228 Z',fill:ROOF,stroke:INK,'stroke-width':7,'stroke-linejoin':'round'},g);
  if(type==='Hexagon')S('path',{d:'M-150 -228 L-110 -320 L110 -320 L150 -228 Z',fill:ROOF,stroke:INK,'stroke-width':7,'stroke-linejoin':'round'},g);
  S('rect',{x:-130,y:-230,width:260,height:230,fill:'#fff',stroke:INK,'stroke-width':7},g);
  S('rect',{x:-104,y:-196,width:76,height:70,rx:8,fill:'#CFE7F2',stroke:INK,'stroke-width':5},g);
  S('rect',{x:20,y:-124,width:70,height:124,fill:INK},g);
  const door=S('g',{},g);S('rect',{x:20,y:-124,width:70,height:124,fill:'#F7F3EA',stroke:INK,'stroke-width':6},door);S('circle',{cx:78,cy:-60,r:5,fill:INK},door);
  T(type,-62,-52,{class:'mono','font-size':30,'text-anchor':'middle',fill:INK},g);
  return {g,door};}
const HX=[900,1300,1700];
['Circle','Square','Triangle'].forEach((t,k)=>{const h=drawHouse(stCam,t);houses.push({...h,hx:HX[k],m:{o:0},p:prop(h.g,{x:550,y:720,s:.25,o:0})});});
const hexH=drawHouse(stCam,'Hexagon');const hexP=prop(hexH.g,{x:2330,y:-500,o:0});houses.push({...hexH,hx:2330,m:{o:0},p:hexP});
/* 커서 */
const curG=S('g',{},stCam);S('path',{d:'M-34 -44 L34 -44 L0 0 Z',fill:AMBER,stroke:INK,'stroke-width':6,'stroke-linejoin':'round'},curG);
T('next()',0,-62,{class:'mono','font-size':30,'text-anchor':'middle',fill:INK},curG);
const cur=prop(curG,{x:900,y:400,s:0,o:0});
/* 방문자 */
const walkers=[];
function drawWalker(p,color,name){const g=S('g',{},p),bob=S('g',{},g);
  const legs=[-16,16].map(x=>{const l=S('g',{},bob);S('rect',{x:x-11,y:-74,width:22,height:74,rx:10,fill:INK},l);return l;});
  S('rect',{x:-46+7,y:-206+7,width:92,height:146,rx:28,fill:INK},bob);
  S('rect',{x:-46,y:-206,width:92,height:146,rx:28,fill:color,stroke:INK,'stroke-width':7},bob);
  S('rect',{x:30,y:-170,width:46,height:60,rx:6,fill:'#fff',stroke:INK,'stroke-width':5},bob);
  S('circle',{cx:0,cy:-250,r:40,fill:'#F6D3B3',stroke:INK,'stroke-width':6},bob);
  S('path',{d:'M-42 -256 A42 40 0 0 1 42 -256 L56 -256 L56 -246 L-42 -246 Z',fill:color,stroke:INK,'stroke-width':6,'stroke-linejoin':'round'},bob);
  const w=Math.round(name.length*30*.6)+40;S('rect',{x:-w/2,y:-350,width:w,height:52,rx:26,fill:'#fff',stroke:INK,'stroke-width':5},bob);
  T(name,0,-313,{class:'mono','font-size':30,'text-anchor':'middle',fill:color},bob);
  const bang=S('g',{style:'opacity:0'},bob);S('circle',{cx:0,cy:-400,r:30,fill:RED,stroke:INK,'stroke-width':5},bang);T('!',0,-388,{class:'plex','font-size':38,'text-anchor':'middle',fill:'#fff'},bang);
  const wk={p:prop(g,{x:-300,y:905}),bob,legs,m:{v:0},bang,ph:walkers.length*1.7};walkers.push(wk);return wk;}
const wA=drawWalker(stCam,VIOLET,'AreaVisitor'),wP=drawWalker(stCam,'#5B3FC4','PrintVisitor');
const visits=['visit(Circle)','visit(Square)','visit(Triangle)'].map((s,k)=>pill(stCam,s,VIOLET,'#fff',HX[k],380));
const acceptP=pill(stCam,'accept(v)',INK,'#fff',HX[0]-10,502,{f:30});
const tags=[['꺼내기',AMBER,INK],['연산 추가',VIOLET,'#fff'],['되돌리기',SKY,'#fff'],['해석',MAG,'#fff']].map(([s,bg,fg],k)=>pill(stCam,s,bg,fg,170+k*300,300,{f:38,mono:false}));
const chipIt=codeChip(stCam,'while (it.hasNext()) it.next();','#9A6A00',1450,975);
const chipAc=codeChip(stCam,'accept(v) { v.visit(this); }',VIOLET,1250,1010);
const fixAll=pill(stCam,'Visitor 전부 수정',RED,'#fff',1820,330,{f:36,mono:false});
/* HUD: 리모컨 (화면 고정) */
const hud=$('#hud'),remG=S('g',{},hud);
S('rect',{x:-100+10,y:-180+10,width:200,height:360,rx:40,fill:INK},remG);
S('rect',{x:-100,y:-180,width:200,height:360,rx:40,fill:'#2B3646',stroke:INK,'stroke-width':7},remG);
const lamp=S('circle',{cx:0,cy:-122,r:20,fill:OK,stroke:INK,'stroke-width':5},remG);
T('hasNext',0,-68,{class:'mono','font-size':30,'text-anchor':'middle',fill:'#fff'},remG);
const btnG=S('g',{transform:'translate(0 50)'},remG),btnI=S('g',{},btnG);
S('circle',{r:60,fill:AMBER,stroke:INK,'stroke-width':7},btnI);T('next',0,11,{class:'mono','font-size':32,'text-anchor':'middle',fill:INK},btnI);
const falseT=T('false',0,150,{class:'mono','font-size':34,'text-anchor':'middle',fill:'#FF8A80',style:'opacity:0'},remG);
const remote=prop(remG,{x:-260,y:905,s:.85});const btn=prop(btnI);
function press(at){tl.to(btn,{s:.86,duration:.1,yoyo:true,repeat:1},at);}

/* ================= VIEW 2: 정면 — Square 집의 간판 ================= */
const frCam=S('g',{},$('#frontSvg')),CF=cam(frCam,1.3,680,440);
S('rect',{x:-600,y:1010,width:3200,height:400,fill:'#E6E9E4',stroke:INK,'stroke-width':6},frCam);
S('rect',{x:274,y:244,width:840,height:780,fill:INK},frCam);
S('rect',{x:260,y:230,width:840,height:780,fill:'#fff',stroke:INK,'stroke-width':8},frCam);
S('rect',{x:220,y:166,width:920,height:80,rx:10,fill:ROOF,stroke:INK,'stroke-width':8},frCam);
for(const x of [330,840])S('rect',{x,y:570,width:190,height:150,rx:10,fill:'#CFE7F2',stroke:INK,'stroke-width':6},frCam);
S('rect',{x:600,y:780,width:160,height:230,fill:'#F7F3EA',stroke:INK,'stroke-width':7},frCam);
T('Square',680,950,{class:'mono','font-size':32,'text-anchor':'middle',fill:INK},frCam);
const signG=S('g',{},frCam);

/* ================= render: tl.time()의 순수 함수 ================= */
const grid=$('#grid'),bl1=$('#bl1'),bl2=$('#bl2');
const viewCam={street:CS,front:CF,board:CB,rail:CR};

  for(const p of props){p.el.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.r}) scale(${p.s})`);p.el.setAttribute('opacity',p.o);}

  for(const b of blurs){if(b.v>.25){b.g.setAttribute('stdDeviation',b.axis==='y'?`${b.v*.12} ${b.v}`:b.axis==='x'?`${b.v} ${b.v*.08}`:`${b.v} ${b.v}`);b.el.style.filter=`url(#${b.id})`;}else b.el.style.filter='none';}
  let cz=1;for(const k in viewCam)if(document.getElementById(k).style.visibility!=='hidden'){cz=viewCam[k].z;break;}
  grid.style.transform=`scale(${(1+.022*Math.sin(t*.8))*(1+(cz-1)*.18)}) translate(${Math.sin(t*.21)*18}px,${Math.cos(t*.17)*14}px)`;
  bl1.style.transform=`translate(${Math.sin(t*.31)*90}px,${Math.cos(t*.27)*60}px)`;bl2.style.transform=`translate(${Math.cos(t*.23)*80}px,${Math.sin(t*.29)*70}px)`;
  /* 골목 */
  crateTxt.textContent=['List?','Tree?','Hash?'][Math.floor(t/.7)%3];
  for(const w of walkers){const s=Math.sin(t*11+w.ph);w.legs[0].setAttribute('transform',`rotate(${s*24*w.m.v} 0 -74)`);w.legs[1].setAttribute('transform',`rotate(${-s*24*w.m.v} 0 -74)`);
    w.bob.setAttribute('transform',`translate(0 ${-Math.abs(s)*7*w.m.v+Math.sin(t*2+w.ph)*2})`);}
  for(const h of houses){let o=h.m.o;for(const w of walkers)o=Math.max(o,clamp(1-(Math.abs(w.p.x-(h.p.x+55))-150)/60));
    h.door.setAttribute('transform',`translate(${o*64} 0)`);}
  /* 정면 간판 */
  signTxt.textContent=SIGN[signState.i];signTxt.setAttribute('fill',signState.i>=3&&signState.i<5?RED:INK);
  /* 문법 트리: interpret() 신호가 가지를 타고 내려간다 */
  for(const p of pulses){const A=NODES[p.a],B=NODES[p.b];p.c.setAttribute('cx',A[0]+(B[0]-A[0])*p.q.v);p.c.setAttribute('cy',A[1]+(B[1]-A[1])*p.q.v);p.c.setAttribute('opacity',p.q.o);}
  /* 레일 */
  for(const c of cards){const tr=trails[c.k];tr.e.setAttribute('stroke-dashoffset',tr.L*(1-c.p));
    const pt=c.path.getPointAtLength(c.L*c.p);c.g.setAttribute('transform',`translate(${pt.x} ${pt.y-64})`);c.g.setAttribute('opacity',c.o);}
  for(const [gi,g] of gates.entries()){let lit=false;for(const c of cards){if(c.o<=0||c.k<gi)continue;if(Math.abs(c.p*c.L-g.len)<70)lit=true;}g.c.setAttribute('fill',lit?LIT:'#fff');}
}

/* ---------- 컨트롤: 자동재생 + 루프, 플레이어 없음. ?debug=1 스크럽, ?clean=1 export ---------- */

addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});

  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
document.fonts.ready.then(()=>{render();window.OPENER.ready=true;if(!q.has('clean'))start();});
