<!--
  GoF 1/6 — Strategy · State · Template Method 판별 explainer (60초, 16:9, 무음 + VO 대본 별도).
  주인공: Context 기계. 슬롯에 꽂는 카트리지 = 합성 필드.
    Strategy  : 밖(Client 손)이 카트리지를 갈아끼운다 → 지도 뷰에서 경로가 바뀐다
    State     : 카트리지가 스스로 다음 카트리지를 만든다 (손 없음) → 자판기 정면 뷰
    Template  : 순서(컨베이어 스테이션)는 부모가 final로 고정, 빈칸만 자식이 용접 → 탑다운 뷰
    리캡      : 판별 레일 ① 상속? ② 누가 바꾸나?
  더블클릭으로 열기. 자동재생 + 루프, R 다시, Space 일시정지. ?debug=1 스크럽, ?clean=1 export용.
  모든 시각 요소는 tl.time()의 순수 함수 (Date.now/Math.random 없음).
-->
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A37;--base:#EEF7F5;--teal:#0F9F8A;--coral:#E5533D;--indigo:#3B5BDB}
html,body{margin:0;height:100%;background:#0d1417;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--base);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif}
#bg{position:absolute;inset:0;overflow:hidden}
.flood{position:absolute;width:4800px;height:4800px;border-radius:50%;transform:scale(0)}
#grid{position:absolute;inset:-240px;background-image:linear-gradient(rgba(31,42,55,.075) 2px,transparent 2px),linear-gradient(90deg,rgba(31,42,55,.075) 2px,transparent 2px);background-size:80px 80px;background-position:center}
.blob{position:absolute;border-radius:50%;width:1300px;height:1300px;background:radial-gradient(circle,rgba(255,255,255,.8),rgba(255,255,255,0) 65%)}
.view{position:absolute;inset:0}
.view svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.plex{font-family:'IBM Plex Sans KR',sans-serif;font-weight:600}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
#ui{position:absolute;inset:0;pointer-events:none}
.say{position:absolute;font-family:'Do Hyeon',sans-serif;line-height:1.12;letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.say .wd{display:inline-block;opacity:0;transform-origin:50% 100%}
.say.halo{text-shadow:0 0 16px #F4F1E6,0 0 34px #F4F1E6,0 0 60px #F4F1E6}
.hl{position:relative}
.hl i{position:absolute;left:-.14em;right:-.14em;top:.0em;bottom:-.02em;border:.05em solid var(--c,var(--ink));border-radius:.14em;transform:scaleX(0);transform-origin:0 50%}
.chip{position:absolute;right:64px;top:54px;padding:8px 30px 12px;border-radius:44px;color:#fff;font:600 42px 'IBM Plex Sans KR',sans-serif;opacity:0;border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(95% 95% at 50% 50%,transparent 62%,rgba(31,42,55,.16))}
#dbg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;gap:12px;align-items:center;padding:10px 16px;border-radius:14px;background:rgba(14,16,22,.9);color:#cfd5e3;font:13px system-ui;z-index:50}
#dbg input{width:420px}#dbg span{font-variant-numeric:tabular-nums;min-width:6ch}
</style>

<body>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<div id="stage">
  <div id="bg">

    <div class="say" id="s2" style="left:0;right:0;text-align:center;top:858px;font-size:118px"><span class="wd hl"><i></i>클래스로</span> <span class="wd">빼낸다</span></div>
    <div class="say halo" id="s3" style="left:110px;top:72px;font-size:108px;--c:var(--teal)"><span class="wd hl"><i></i>밖에서</span> <span class="wd">갈아끼운다</span></div>
    <div class="say" id="s4" style="left:1170px;top:690px;font-size:124px;--c:var(--coral)"><span class="wd">안에서</span><br><span class="wd hl"><i></i>스스로</span> <span class="wd">바뀐다</span></div>
    <div class="say" id="s5" style="left:0;right:0;text-align:center;top:846px;font-size:106px;--c:var(--indigo)"><span class="wd">순서는</span> <span class="wd">부모,</span> <span class="wd hl"><i></i>빈칸은</span> <span class="wd">자식</span></div>
    <div class="say" id="s6" style="left:0;right:0;text-align:center;top:330px;font-size:116px"><span class="wd">상속이면</span> <span class="wd" style="color:var(--indigo)">Template Method</span><br><span class="wd">합성이면</span> <span class="wd hl"><i></i>누가</span> <span class="wd">바꾸는지</span></div>
    <div class="chip" id="chS" style="background:var(--teal)">Strategy</div>

  </div>
  <div id="dbg"><button id="dPlay">Pause</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const W=1920,H=1080,DUR=60,V=150;   // V = 컨베이어 속도(px/초)
const INK='#1F2A37',TEAL='#0F9F8A',CORAL='#E5533D',INDIGO='#3B5BDB',GRAY='#C5CFCC',LIT='#FFD34E';
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',defs=$('#defs');
function S(tag,a={},p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const T=(txt,x,y,a,p)=>{const e=S('text',{x,y,...a},p);e.textContent=txt;return e;};
const mod=(a,n)=>((a%n)+n)%n,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
let uid=0;
const tl=gsap.timeline({paused:true});

/* ---------- prop: SVG 그룹의 변환을 수동으로 쓴다 (GSAP transformOrigin 문제 회피) ---------- */
const props=[];
function prop(el,i={}){const p={el,x:0,y:0,s:1,r:0,o:1,...i};props.push(p);return p;}
/* ---------- 카메라: 뷰마다 하나, 초점(cx,cy) + 줌 z ---------- */
const cams=[];
function cam(g,z,cx,cy){const c={g,z,cx,cy,z0:z,cx0:cx,cy0:cy};cams.push(c);return c;}
const shot=(c,at,dur,z,cx,cy,ease='power2.inOut')=>tl.to(c,{z,cx,cy,duration:dur,ease},at);
const cutTo=(c,at,z,cx,cy)=>tl.set(c,{z,cx,cy},at);
/* ---------- 방향성 모션 블러 (feGaussianBlur x/y 분리) ---------- */
const blurs=[],blurMap=new Map();
function blurOf(el,axis='y'){if(blurMap.has(el))return blurMap.get(el);const id='mb'+(uid++);
  const f=S('filter',{id,x:'-40%',y:'-80%',width:'180%',height:'260%'},defs),g=S('feGaussianBlur',{stdDeviation:'0 0'},f);
  const b={el,g,id,axis,v:0};blurs.push(b);blurMap.set(el,b);return b;}

/* ================= 그림 부품 ================= */
/* 카트리지: 원점 = 꽂히는 선. 보이는 몸통은 원점 위 (h-50), 아래 50px은 슬롯 안에 숨는다 */
function drawCart(p,{color,label='',sub='',w=150,h=210,title=''}){
  const g=S('g',{},p),top=-h+50;
  S('rect',{x:-w/2+9,y:top+9,width:w,height:h,rx:16,fill:INK},g);
  S('rect',{x:-w/2,y:top,width:w,height:h,rx:16,fill:color,stroke:INK,'stroke-width':7},g);
  for(let i=0;i<3;i++)S('rect',{x:-w/2+24,y:top+18+i*15,width:w-48,height:6,rx:3,fill:INK,opacity:.28},g);
  if(label){const ph=sub?100:66;S('rect',{x:-w/2+14,y:top+70,width:w-28,height:ph,rx:10,fill:'#fff',stroke:INK,'stroke-width':4},g);
    T(label,0,top+70+46,{class:'plex','font-size':38,'text-anchor':'middle',fill:INK},g);
    if(sub)T(sub,0,top+70+87,{class:'mono','font-size':30,'text-anchor':'middle',fill:color},g);}
  if(title)T(title,0,top-26,{class:'plex','font-size':40,'text-anchor':'middle',fill:INK},g);
  return g;}
/* 손: dir 1 = 왼쪽에서 들어옴, -1 = 오른쪽. 원점 = 장갑 앞쪽 끝(잡기) 또는 손가락 끝(point) */
function drawHand(p,dir=1,point=false,label='Client'){
  const g=S('g',{},p),m=S('g',{transform:`scale(${dir} 1)${point?' translate(-62 0)':''}`},g);
  S('rect',{x:-1700,y:-40,width:1560,height:80,fill:'#55657A',stroke:INK,'stroke-width':7},m);
  S('rect',{x:-160,y:-52,width:44,height:104,rx:10,fill:'#fff',stroke:INK,'stroke-width':7},m);
  S('rect',{x:-120,y:-56,width:120,height:112,rx:46,fill:'#fff',stroke:INK,'stroke-width':7},m);
  if(point)S('rect',{x:-16,y:-15,width:78,height:30,rx:15,fill:'#fff',stroke:INK,'stroke-width':7},m);
  else S('path',{d:'M-66 -56 C-46 -90 -8 -84 -6 -54',fill:'#fff',stroke:INK,'stroke-width':7},m);
  if(label)T(label,dir*(-620-(point?62:0)),13,{class:'mono','font-size':36,'text-anchor':'middle',fill:'#fff'},g);
  return g;}
/* Context 기계(측면): 원점 = 바닥 중앙. 카트리지 층은 몸통 뒤 → 꽂으면 아래가 숨는다 */
function drawMachine(p){
  const root=S('g',{},p),cartLayer=S('g',{},root),sh=S('g',{},root),shake=prop(sh);
  S('rect',{x:-266,y:-366,width:560,height:380,rx:36,fill:INK},sh);
  S('rect',{x:-280,y:-380,width:560,height:380,rx:36,fill:'#fff',stroke:INK,'stroke-width':8},sh);
  S('rect',{x:-104,y:-396,width:208,height:28,rx:10,fill:INK},sh);
  S('rect',{x:-284,y:-116,width:26,height:116,fill:INK},sh);S('rect',{x:258,y:-116,width:26,height:116,fill:INK},sh);
  S('rect',{x:-212,y:-334,width:424,height:204,rx:18,fill:INK},sh);
  const id='cw'+(uid++),cp=S('clipPath',{id},defs);S('rect',{x:-212,y:-334,width:424,height:204,rx:18},cp);
  const screen=S('g',{'clip-path':`url(#${id})`},sh);
  const led=S('circle',{cx:206,cy:-62,r:20,fill:GRAY,stroke:INK,'stroke-width':6},sh);
  S('circle',{cx:150,cy:-62,r:9,fill:INK,opacity:.25},sh);S('circle',{cx:114,cy:-62,r:9,fill:INK,opacity:.25},sh);
  T('Context',-216,-48,{class:'mono','font-size':36,fill:INK},sh);
  const sp=S('g',{},root),spark=prop(sp,{x:0,y:-392,o:0});
  for(let k=0;k<7;k++){const a=-Math.PI*(k+.5)/7;S('line',{x1:Math.cos(a)*44,y1:Math.sin(a)*44,x2:Math.cos(a)*84,y2:Math.sin(a)*84,stroke:INK,'stroke-width':7,'stroke-linecap':'round'},sp);}
  const front=S('g',{},root);
  return {root,cartLayer,shake,screen,led,spark,front};}
function sparks(p,n=8,r0=40,r1=80){const g=S('g',{},p);for(let k=0;k<n;k++){const a=Math.PI*2*k/n;S('line',{x1:Math.cos(a)*r0,y1:Math.sin(a)*r0,x2:Math.cos(a)*r1,y2:Math.sin(a)*r1,stroke:INK,'stroke-width':7,'stroke-linecap':'round'},g);}return g;}

/* ---------- 타임라인 헬퍼 ---------- */
function snap(m,at,color){   // 시그니처 모션: 철컥 — 흔들림 + LED + 스파크
  tl.to(m.shake,{y:8,duration:.05,yoyo:true,repeat:5,ease:'sine.inOut'},at);
  tl.set(m.led,{attr:{fill:color}},at);
  tl.fromTo(m.spark,{o:1,s:.6},{o:0,s:1.5,duration:.42,ease:'power2.out',immediateRender:false},at);}
function carry(hand,cart,at,dur,x,y,{ease='power3.out',dir=1,w=150}={}){
  tl.to(cart,{x,y,duration:dur,ease},at);tl.to(hand,{x:x-dir*(w/2+4),y:y-55,duration:dur,ease},at);}
const show=(el,at,d=.25)=>tl.to(el,{opacity:1,duration:d},at), hide=(el,at,d=.25)=>tl.to(el,{opacity:0,duration:d},at);
const pop=(p,at,{d=.6,from=0,ease='back.out(1.8)'}={})=>tl.fromTo(p,{s:from,o:0},{s:1,o:1,duration:d,ease,immediateRender:false},at);
function say(id,at,st=.09){const el=$(id),w=el.querySelectorAll('.wd'),b=blurOf(el);
  tl.fromTo(w,{opacity:0,yPercent:70,scaleY:1.35},{opacity:1,yPercent:0,scaleY:1,duration:.8,ease:'power4.out',stagger:st,immediateRender:false},at);
  tl.fromTo(b,{v:20},{v:0,duration:.8+st*(w.length-1),ease:'power3.out',immediateRender:false},at);
  el.querySelectorAll('.hl i').forEach(i=>tl.fromTo(i,{scaleX:0},{scaleX:1,duration:.5,ease:'power3.out',immediateRender:false},at+.3+st*w.length));}
function unsay(id,at){const el=$(id),w=el.querySelectorAll('.wd'),b=blurOf(el);
  tl.to(w,{opacity:0,yPercent:-60,duration:.4,ease:'power2.in',stagger:.025},at);
  tl.fromTo(b,{v:0},{v:16,duration:.45,ease:'power2.in',immediateRender:false},at);tl.set(b,{v:0},at+.55);}
function chipIn(id,at){const el=$(id),b=blurOf(el,'x');
  tl.fromTo(el,{opacity:0,x:90},{opacity:1,x:0,duration:.6,ease:'power4.out',immediateRender:false},at);
  tl.fromTo(b,{v:24},{v:0,duration:.6,ease:'power3.out',immediateRender:false},at);}
const chipOut=(id,at)=>tl.to($(id),{opacity:0,x:70,duration:.35,ease:'power2.in'},at);
const flood=(id,at)=>tl.fromTo(id,{scale:0},{scale:1,duration:1.1,ease:'power2.inOut',immediateRender:false},at);
function whip(t,from,to,dir=1){const bf=blurOf($(from)),bt=blurOf($(to));
  tl.to(from,{y:-150*dir,duration:.28,ease:'power2.in'},t);tl.fromTo(bf,{v:0},{v:24,duration:.28,ease:'power2.in',immediateRender:false},t);
  tl.set(from,{visibility:'hidden'},t+.28);tl.set(to,{visibility:'visible',y:150*dir},t+.28);tl.set(bt,{v:24},t+.28);
  tl.to(to,{y:0,duration:.42,ease:'power3.out'},t+.28);tl.to(bt,{v:0,duration:.42,ease:'power3.out'},t+.28);
  tl.set(from,{y:0},t+.3);tl.set(bf,{v:0},t+.3);}

/* ================= VIEW 1: 측면 — 컨베이어 + Context 기계 ================= */
const sideCam=S('g',{},$('#sideSvg')),CS=cam(sideCam,1.75,960,530);
const beltStripes=[],items=[];
{const g=S('g',{},sideCam);
  S('rect',{x:-600,y:826,width:3120,height:18,rx:9,fill:INK,opacity:.1},g);
  for(const x of [330,1590])S('rect',{x:x-12,y:800,width:24,height:150,fill:'#2B3646'},g);
  S('rect',{x:-600,y:760,width:3120,height:46,rx:23,fill:'#2B3646'},g);
  for(let i=0;i<54;i++)beltStripes.push(S('rect',{x:0,y:769,width:16,height:28,rx:4,fill:'#4A5A70'},g));}
for(let i=0;i<10;i++){const g=S('g',{},sideCam);
  const r=S('rect',{x:-45,y:-90,width:90,height:90,rx:16,fill:'#fff',stroke:INK,'stroke-width':6},g);
  const tx=T('{ }',0,-33,{class:'mono','font-size':34,'text-anchor':'middle',fill:INK},g);items.push({g,r,tx,i});}
const mw=S('g',{transform:'translate(960 760)'},sideCam),M=drawMachine(mw);
/* 화면: 엉킨 if/else 전선 + 코드 → 경로 이름 → 빨간 화면(push-through) */
const wires=[TEAL,CORAL,INDIGO].map(c=>S('path',{fill:'none',stroke:c,'stroke-width':8,opacity:.55,'stroke-linecap':'round'},M.screen));
const scrCode=S('g',{},M.screen);
[['if (fast) {…}',TEAL],['else if (free) {…}',CORAL],['else {…}',INDIGO]].forEach(([s,c],k)=>{
  S('rect',{x:-196,y:-308+k*54,width:8,height:36,rx:4,fill:c},scrCode);T(s,-176,-280+k*54,{class:'mono','font-size':31,fill:'#E6F2EF'},scrCode);});
const scrA=T('최단 경로',0,-214,{class:'plex','font-size':52,'text-anchor':'middle',fill:'#7EE0CF',style:'opacity:0'},M.screen);
const scrB=T('무료 경로',0,-214,{class:'plex','font-size':52,'text-anchor':'middle',fill:'#7EE0CF',style:'opacity:0'},M.screen);
const scrRed=S('rect',{x:-220,y:-340,width:440,height:220,fill:CORAL,style:'opacity:0'},M.screen);
/* 신호등 ① ② */
const lamps=[['상속/합성',-200,'1'],['누가 바꾸나',200,'2']].map(([lab,x,n])=>{const g=S('g',{},M.front);
  S('rect',{x:-6,y:24,width:12,height:36,fill:INK},g);
  const c=S('circle',{r:30,fill:'#fff',stroke:INK,'stroke-width':7},g);
  T(n,0,12,{class:'mono','font-size':34,'text-anchor':'middle',fill:INK},g);
  T(lab,0,-46,{class:'plex','font-size':36,'text-anchor':'middle',fill:INK},g);
  return {p:prop(g,{x,y:-440,s:0,o:0}),c};});
/* 훅 카트리지 3개 (창에서 튀어나옴) */
const HK=[[TEAL,'Strategy',-380],[CORAL,'State',0],[INDIGO,'Template Method',380]].map(([c,n,x])=>({p:prop(drawCart(M.front,{color:c,h:170,title:n}),{x:0,y:-230,s:.2,o:0}),x}));
/* 손 + 전략 카트리지 */
const cA=prop(drawCart(M.cartLayer,{color:TEAL,label:'최단'}),{x:-1300,y:-600});
const cB=prop(drawCart(M.cartLayer,{color:TEAL,label:'무료'}),{x:0,y:-382,o:0});
const hS=prop(drawHand(M.front,1),{x:-1300-79,y:-655});

/* ================= VIEW 2: 지도 — 전략에 따라 경로가 바뀐다 ================= */
const mapCam=S('g',{},$('#mapSvg')),CM=cam(mapCam,1.45,560,700);
S('rect',{x:-1500,y:-1200,width:4900,height:3600,fill:'#F4F1E6'},mapCam);

/* ================= render: tl.time()의 순수 함수 ================= */
const grid=$('#grid'),bl1=$('#bl1'),bl2=$('#bl2');
const viewCam={side:CS,map:CM,vend:CV,top:CT,rail:CR};
function render(){const t=tl.time(),d=V*t;
  for(const p of props){p.el.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.r}) scale(${p.s})`);p.el.setAttribute('opacity',p.o);}
  for(const c of cams){const z=c.z*(1+.006*Math.sin(t*.9));c.g.setAttribute('transform',`translate(960 540) scale(${z}) translate(${-c.cx} ${-c.cy})`);}
  for(const b of blurs){if(b.v>.25){b.g.setAttribute('stdDeviation',b.axis==='y'?`${b.v*.12} ${b.v}`:b.axis==='x'?`${b.v} ${b.v*.08}`:`${b.v} ${b.v}`);b.el.style.filter=`url(#${b.id})`;}else b.el.style.filter='none';}
  /* 배경: 그리드가 숨쉬고, 보이는 카메라 줌에 살짝 따라간다(패럴랙스) */
  let cz=1;for(const k in viewCam)if(document.getElementById(k).style.visibility!=='hidden'){cz=viewCam[k].z;break;}
  grid.style.transform=`scale(${(1+.022*Math.sin(t*.8))*(1+(cz-1)*.18)}) translate(${Math.sin(t*.21)*18}px,${Math.cos(t*.17)*14}px)`;
  bl1.style.transform=`translate(${Math.sin(t*.31)*90}px,${Math.cos(t*.27)*60}px)`;bl2.style.transform=`translate(${Math.cos(t*.23)*80}px,${Math.sin(t*.29)*70}px)`;
  /* 측면 컨베이어 */
  beltStripes.forEach((s,i)=>s.setAttribute('x',mod(i*60+d,3240)-600));
  for(const it of items){const x=mod(it.i*270+d,2700)-400,tp=t-(x-960)/V;let c='#fff';
    if(x>1000)c=tp<8.3?[TEAL,CORAL,INDIGO][it.i%3]:tp<10.4?GRAY:tp<21.8?TEAL:GRAY;
    it.g.setAttribute('transform',`translate(${x} 760)`);it.r.setAttribute('fill',c);it.tx.setAttribute('fill',c==='#fff'||c===GRAY?INK:'#fff');}
  wires.forEach((w,k)=>{const a=Math.sin(t*1.3+k*2.1),b=Math.cos(t*1.7+k);
    w.setAttribute('d',`M-230 ${-310+k*40} C ${-90+60*a} ${-120-40*k}, ${70-70*b} ${-330+30*k}, 230 ${-160-50*k}`);});
  /* 지도 경로 */
  rt1.setAttribute('stroke-dashoffset',L1*(1-route.p1));rt2.setAttribute('stroke-dashoffset',L2*(1-route.p2));
  {const useB=route.p2>0,el=useB?rt2:rt1,L=useB?L2:L1,q=useB?route.p2:route.p1,a=el.getPointAtLength(L*q),b=el.getPointAtLength(Math.min(L,L*q+2));
    car.setAttribute('transform',`translate(${a.x} ${a.y}) rotate(${Math.atan2(b.y-a.y,b.x-a.x)*57.3})`);}
  /* 탑다운 컨베이어 + 라면 그릇: 각 스테이션을 지날 때 그 스테이션이 일하고 있었으면 내용이 생긴다 */
  topStripes.forEach((s,i)=>s.setAttribute('x',mod(i*60+d,3240)-600));
  for(const b of bowls){const x=mod(b.i*340+d,2380)-300,done=k=>x>XS[k]&&(t-(x-XS[k])/V)>=ACT[k];
    b.g.setAttribute('transform',`translate(${x} 560)`);
    b.water.setAttribute('opacity',done(0)?1:0);b.noodle.setAttribute('opacity',done(1)?1:0);b.soup.setAttribute('opacity',done(2)?.9:0);b.chop.setAttribute('opacity',done(3)?1:0);}
  /* 판별 레일: 카드가 지나간 자리에 색 궤적, 게이트 통과 순간 점등 */
  for(const c of cards){const tr=trails[c.k];tr.e.setAttribute('stroke-dashoffset',tr.L*(1-c.p));
    const pt=c.path.getPointAtLength(c.L*c.p);c.g.setAttribute('transform',`translate(${pt.x} ${pt.y-64})`);c.g.setAttribute('opacity',c.o);}
  for(const [gi,g] of gates.entries()){let lit=false;for(const c of cards){if(c.o<=0||(gi===1&&c.k===0))continue;if(Math.abs(c.p*c.L-g.len)<70)lit=true;}g.c.setAttribute('fill',lit?LIT:'#fff');}
}
gsap.ticker.add(render);

/* ---------- 컨트롤: 자동재생 + 루프, 플레이어 없음. ?debug=1 스크럽, ?clean=1 export ---------- */
const q=new URLSearchParams(location.search);
const start=()=>tl.play(0);
tl.eventCallback('onComplete',start);
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);render();},play:start};
window.OPENER.seekFrame=t=>{window.OPENER.seek(t);return Promise.resolve();};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
  gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
document.fonts.ready.then(()=>{render();window.OPENER.ready=true;if(!q.has('clean'))start();});
</script>
