<title>원본을 감싸는 껍데기</title>
<!--
  GoF 2/6 — Decorator · Proxy · Adapter 판별 explainer (60초, 16:9, 무음 + VO 대본 별도).
  주인공: "원본" 상자. 래퍼 = 원본을 감싸는 껍데기(shell). 플러그 모양 = 인터페이스.
    Adapter   : 둥근 플러그가 네모 구멍에 안 맞는다 → 껍데기가 바깥은 둥글게, 안은 네모로 바꿔 끼운다
    Decorator : 위에서 본 겹 고리(Milk, Whip)를 Client가 쌓는다. 호출은 항상 원본까지 갔다가 +500씩 얹어 돌아온다
    Proxy     : 프레임워크가 끼운 껍데기에 문(gate)이 있다. 거절하거나, 처음 필요할 때 원본을 만든다
    리캡      : 판별 레일 ① 인터페이스 같나? ② 원본 호출은?
  더블클릭으로 열기. 자동재생 + 루프, R 다시, Space 일시정지. ?debug=1 스크럽, ?clean=1 export용.
  모든 시각 요소는 tl.time()의 순수 함수.
-->
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A37;--base:#EEF7F5;--amber:#E08A0B;--berry:#B83F7A;--green:#2E8B47}
html,body{margin:0;height:100%;background:#0d1417;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--base);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif}
#bg{position:absolute;inset:0;overflow:hidden}
.flood{position:absolute;width:4800px;height:4800px;border-radius:50%;transform:scale(0);left:-1440px;top:-1860px}
#grid{position:absolute;inset:-240px;background-image:linear-gradient(rgba(31,42,55,.075) 2px,transparent 2px),linear-gradient(90deg,rgba(31,42,55,.075) 2px,transparent 2px);background-size:80px 80px;background-position:center}
.blob{position:absolute;border-radius:50%;width:1300px;height:1300px;background:radial-gradient(circle,rgba(255,255,255,.8),rgba(255,255,255,0) 65%)}
.view{position:absolute;inset:0}
.view svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.plex{font-family:'IBM Plex Sans KR',sans-serif;font-weight:600}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
.num{font-family:'Do Hyeon',sans-serif;font-variant-numeric:tabular-nums}
#ui{position:absolute;inset:0;pointer-events:none}
.say{position:absolute;font-family:'Do Hyeon',sans-serif;line-height:1.12;letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.say .wd{display:inline-block;opacity:0;transform-origin:50% 100%}
.hl{position:relative}
.hl i{position:absolute;left:-.14em;right:-.14em;top:.0em;bottom:-.02em;border:.05em solid var(--c,var(--ink));border-radius:.14em;transform:scaleX(0);transform-origin:0 50%}
.chip{position:absolute;right:64px;top:54px;padding:8px 30px 12px;border-radius:44px;color:#fff;font:600 42px 'IBM Plex Sans KR',sans-serif;opacity:0;border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(95% 95% at 50% 50%,transparent 62%,rgba(31,42,55,.16))}
#dbg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;gap:12px;align-items:center;padding:10px 16px;border-radius:14px;background:rgba(14,16,22,.9);color:#cfd5e3;font:13px system-ui;z-index:50}
#dbg input{width:420px}#dbg span{font-variant-numeric:tabular-nums;min-width:6ch}
</style>
</head>
<body>

    <div class="say" id="s4" style="left:0;right:0;text-align:center;top:852px;font-size:106px;--c:var(--berry)"><span class="wd hl"><i></i>항상</span> <span class="wd">부르고</span> <span class="wd">위에</span> <span class="wd">얹는다</span></div>

    <div class="say" id="s6" style="left:0;right:0;text-align:center;top:858px;font-size:104px;--c:var(--green)"><span class="wd hl"><i></i>프레임워크가</span> <span class="wd">끼우면</span> <span class="wd" style="color:var(--green)">Proxy</span></div>
    <div class="say" id="s7" style="left:0;right:0;text-align:center;top:330px;font-size:112px"><span class="wd">인터페이스가</span> <span class="wd">다르면</span> <span class="wd" style="color:var(--amber)">Adapter</span><br><span class="wd">같으면</span> <span class="wd">원본을</span> <span class="wd hl"><i></i>어떻게</span> <span class="wd">부르나</span></div>
    <div class="chip" id="chA" style="background:var(--amber)">Adapter</div>
    <div class="chip" id="chD" style="background:var(--berry)">Decorator</div>

  </div>
  <div id="dbg"><button id="dPlay">Pause</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const W=1920,H=1080,DUR=60;
const INK='#1F2A37',AMBER='#E08A0B',BERRY='#B83F7A',GREEN='#2E8B47',GRAY='#C5CFCC',LIT='#FFD34E',RED='#D7263D',SLATE='#55657A';
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',defs=$('#defs');
function S(tag,a={},p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const T=(txt,x,y,a,p)=>{const e=S('text',{x,y,...a},p);e.textContent=txt;return e;};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
let uid=0;
const tl=gsap.timeline({paused:true});

/* ---------- 엔진 (0049와 동일): prop / 카메라 / 방향성 블러 ---------- */
const props=[];
function prop(el,i={}){const p={el,x:0,y:0,s:1,r:0,o:1,...i};props.push(p);return p;}
const cams=[];
function cam(g,z,cx,cy){const c={g,z,cx,cy,z0:z,cx0:cx,cy0:cy};cams.push(c);return c;}
const shot=(c,at,dur,z,cx,cy,ease='power2.inOut')=>tl.to(c,{z,cx,cy,duration:dur,ease},at);
const cutTo=(c,at,z,cx,cy)=>tl.set(c,{z,cx,cy},at);
const blurs=[],blurMap=new Map();
function blurOf(el,axis='y'){if(blurMap.has(el))return blurMap.get(el);const id='mb'+(uid++);
  const f=S('filter',{id,x:'-40%',y:'-80%',width:'180%',height:'260%'},defs),g=S('feGaussianBlur',{stdDeviation:'0 0'},f);
  const b={el,g,id,axis,v:0};blurs.push(b);blurMap.set(el,b);return b;}

/* ---------- 공용 그림 ---------- */
function drawHand(p,dir=1,point=false,label='Client'){
  const g=S('g',{},p),m=S('g',{transform:`scale(${dir} 1)${point?' translate(-62 0)':''}`},g);
  S('rect',{x:-1700,y:-40,width:1560,height:80,fill:SLATE,stroke:INK,'stroke-width':7},m);
  S('rect',{x:-160,y:-52,width:44,height:104,rx:10,fill:'#fff',stroke:INK,'stroke-width':7},m);
  S('rect',{x:-120,y:-56,width:120,height:112,rx:46,fill:'#fff',stroke:INK,'stroke-width':7},m);
  if(point)S('rect',{x:-16,y:-15,width:78,height:30,rx:15,fill:'#fff',stroke:INK,'stroke-width':7},m);
  else S('path',{d:'M-66 -56 C-46 -90 -8 -84 -6 -54',fill:'#fff',stroke:INK,'stroke-width':7},m);
  if(label)T(label,dir*(-620-(point?62:0)),13,{class:'mono','font-size':36,'text-anchor':'middle',fill:'#fff'},g);
  return g;}
function sparks(p,n=8,r0=40,r1=80){const g=S('g',{},p);for(let k=0;k<n;k++){const a=Math.PI*2*k/n;S('line',{x1:Math.cos(a)*r0,y1:Math.sin(a)*r0,x2:Math.cos(a)*r1,y2:Math.sin(a)*r1,stroke:INK,'stroke-width':7,'stroke-linecap':'round'},g);}return g;}
function chipG(p,txt,color,w,x,y){const g=S('g',{},p);S('rect',{x:-w/2+7,y:-34+7,width:w,height:68,rx:14,fill:INK},g);S('rect',{x:-w/2,y:-34,width:w,height:68,rx:14,fill:'#fff',stroke:INK,'stroke-width':5},g);
  T(txt,0,12,{class:'mono','font-size':34,'text-anchor':'middle',fill:color},g);return prop(g,{x,y,s:0,o:0});}
/* 인터페이스 모양: 둥근 코 / 네모. 구멍은 면(x0)에서 안쪽으로 파인다, 프롱은 끝이 원점 */
const HOLE={round:x=>`M${x} -33 h32 a33 33 0 0 1 0 66 h-32 Z`,square:x=>`M${x} -31 h64 v62 h-64 Z`};
const PRONG={round:'M-62 -29 h33 a29 29 0 0 1 0 58 h-33 Z',square:'M-62 -29 h62 v58 h-62 Z'};

/* ---------- 타임라인 헬퍼 ---------- */
const show=(el,at,d=.25)=>tl.to(el,{opacity:1,duration:d},at), hide=(el,at,d=.25)=>tl.to(el,{opacity:0,duration:d},at);
const pop=(p,at,{d=.6,from=0,ease='back.out(1.8)'}={})=>tl.fromTo(p,{s:from,o:0},{s:1,o:1,duration:d,ease,immediateRender:false},at);
const burst=(p,at)=>tl.fromTo(p,{o:1,s:.6},{o:0,s:1.5,duration:.42,ease:'power2.out',immediateRender:false},at);
const jolt=(p,at,a=8)=>tl.to(p,{y:`+=${a}`,duration:.05,yoyo:true,repeat:5,ease:'sine.inOut'},at);
function say(id,at,st=.09){const el=$(id),w=el.querySelectorAll('.wd'),b=blurOf(el);
  tl.fromTo(w,{opacity:0,yPercent:70,scaleY:1.35},{opacity:1,yPercent:0,scaleY:1,duration:.8,ease:'power4.out',stagger:st,immediateRender:false},at);
  tl.fromTo(b,{v:20},{v:0,duration:.8+st*(w.length-1),ease:'power3.out',immediateRender:false},at);
  el.querySelectorAll('.hl i').forEach(i=>tl.fromTo(i,{scaleX:0},{scaleX:1,duration:.5,ease:'power3.out',immediateRender:false},at+.3+st*w.length));}
function unsay(id,at){const el=$(id),w=el.querySelectorAll('.wd'),b=blurOf(el);
  tl.to(w,{opacity:0,yPercent:-60,duration:.4,ease:'power2.in',stagger:.025},at);
  tl.fromTo(b,{v:0},{v:16,duration:.45,ease:'power2.in',immediateRender:false},at);tl.set(b,{v:0},at+.55);}
function chipIn(id,at){const el=$(id),b=blurOf(el,'x');
  tl.fromTo(el,{opacity:0,x:90},{opacity:1,x:0,duration:.6,ease:'power4.out',immediateRender:false},at);
  tl.fromTo(b,{v:24},{v:0,duration:.6,ease:'power3.out',immediateRender:false},at);}
const chipOut=(id,at)=>tl.to($(id),{opacity:0,x:70,duration:.35,ease:'power2.in'},at);
const flood=(id,at)=>tl.fromTo(id,{scale:0},{scale:1,duration:1.1,ease:'power2.inOut',immediateRender:false},at);
function whip(t,from,to,dir=1){const bf=blurOf($(from)),bt=blurOf($(to));
  tl.to(from,{y:-150*dir,duration:.28,ease:'power2.in'},t);tl.fromTo(bf,{v:0},{v:24,duration:.28,ease:'power2.in',immediateRender:false},t);
  tl.set(from,{visibility:'hidden'},t+.28);tl.set(to,{visibility:'visible',y:150*dir},t+.28);tl.set(bt,{v:24},t+.28);
  tl.to(to,{y:0,duration:.42,ease:'power3.out'},t+.28);tl.to(bt,{v:0,duration:.42,ease:'power3.out'},t+.28);
  tl.set(from,{y:0},t+.3);tl.set(bf,{v:0},t+.3);}
function rack(t,from,to){const bf=blurOf($(from),'xy'),bt=blurOf($(to),'xy');
  tl.to(from,{scale:.86,opacity:0,duration:.7,ease:'power2.in'},t);tl.fromTo(bf,{v:0},{v:16,duration:.7,ease:'power2.in',immediateRender:false},t);
  tl.set(to,{visibility:'visible',scale:1.18,opacity:0},t+.4);tl.set(bt,{v:16},t+.4);
  tl.to(to,{scale:1,opacity:1,duration:.85,ease:'power3.out'},t+.4);tl.to(bt,{v:0,duration:.85,ease:'power3.out'},t+.4);
  tl.set(from,{visibility:'hidden'},t+.7);tl.set(bf,{v:0},t+.7);}

/* ================= VIEW 1: 측면 작업대 — 원본 상자 + 플러그 ================= */
const sideCam=S('g',{},$('#sideSvg')),CS=cam(sideCam,1.5,1180,520);
{S('rect',{x:-600,y:718,width:3120,height:18,rx:9,fill:INK,opacity:.08},sideCam);
  for(const x of [430,1880])S('rect',{x:x-13,y:700,width:26,height:420,fill:INK},sideCam);
  S('rect',{x:300,y:670,width:1720,height:34,rx:12,fill:'#D9CBB0',stroke:INK,'stroke-width':7},sideCam);}
const L={};for(const k of ['paper','shellBack','core','shellFront','plug','pulse','front'])L[k]=S('g',{},sideCam);
/* 원본 상자: 원점 = 상자 중심 (1240,520). 왼쪽 면에 인터페이스 구멍 */
const coreG=S('g',{},L.core);
S('rect',{x:-138,y:-138,width:300,height:300,rx:26,fill:INK},coreG);
S('rect',{x:-150,y:-150,width:300,height:300,rx:26,fill:'#fff',stroke:INK,'stroke-width':8},coreG);
const holeR=S('path',{d:HOLE.round(-154),fill:INK},coreG),holeS=S('path',{d:HOLE.square(-154),fill:INK,style:'opacity:0'},coreG);
const coreLamp=S('circle',{cx:108,cy:-108,r:20,fill:GRAY,stroke:INK,'stroke-width':5},coreG);
const lblO=T('원본',16,18,{class:'plex','font-size':54,'text-anchor':'middle',fill:INK},coreG);
const lblP=T('OldPrinter',30,14,{class:'mono','font-size':32,'text-anchor':'middle',fill:INK,style:'opacity:0'},coreG);
const pic=S('g',{style:'opacity:0'},coreG);
S('rect',{x:-56,y:-86,width:144,height:108,rx:12,fill:'#DCEBF7',stroke:INK,'stroke-width':5},pic);
S('path',{d:'M-50 16 L-8 -36 L18 -6 L40 -26 L82 16 Z',fill:GREEN,stroke:INK,'stroke-width':4,'stroke-linejoin':'round'},pic);S('circle',{cx:54,cy:-58,r:12,fill:LIT,stroke:INK,'stroke-width':3},pic);
const lblR=T('RealImage',16,92,{class:'mono','font-size':34,'text-anchor':'middle',fill:INK,style:'opacity:0'},coreG);
const core=prop(coreG,{x:1240,y:520});
const ghostG=S('g',{},L.core);S('rect',{x:-150,y:-150,width:300,height:300,rx:26,fill:'none',stroke:INK,'stroke-width':6,'stroke-dasharray':'20 14'},ghostG);
T('아직 없음',0,14,{class:'plex','font-size':40,'text-anchor':'middle',fill:INK},ghostG);
const ghost=prop(ghostG,{x:1240,y:520,o:0});
const coreSpark=prop(sparks(L.front,10,170,215),{x:1240,y:520,o:0});
/* 래퍼 껍데기: 원본보다 큰 상자. 바깥 구멍 = 밖에 보이는 인터페이스, 안쪽 프롱 = 원본에 꽂는 모양 */
function drawShell(color,light,name,{outer='round',inner='round',gate=false}={}){
  const b=S('g',{},L.shellBack),f=S('g',{},L.shellFront);
  S('rect',{x:-238,y:-218,width:460,height:380,rx:30,fill:INK},b);
  S('rect',{x:-250,y:-230,width:460,height:380,rx:30,fill:light},b);
  S('path',{d:'M-250 -174 V-200 a30 30 0 0 1 30 -30 H180 a30 30 0 0 1 30 30 V-174 Z',fill:color},b);
  S('rect',{x:-250,y:-230,width:460,height:380,rx:30,fill:'none',stroke:INK,'stroke-width':8},b);
  S('line',{x1:-250,y1:-174,x2:210,y2:-174,stroke:INK,'stroke-width':6},b);
  T(name,-20,-188,{class:'plex','font-size':38,'text-anchor':'middle',fill:'#fff'},b);
  if(outer)S('path',{d:HOLE[outer](-254),fill:INK},b);
  if(inner){S('rect',{x:-196,y:-14,width:56,height:28,fill:color,stroke:INK,'stroke-width':5},f);S('path',{d:PRONG[inner],fill:color,stroke:INK,'stroke-width':5,transform:'translate(-90 0)'},f);}
  let g=null;if(gate){const gg=S('g',{},L.shellFront);S('rect',{x:-10,y:-58,width:20,height:116,rx:6,fill:'#1E6B34',stroke:INK,'stroke-width':5},gg);g=prop(gg,{x:1240-169,y:-280});}
  return {b:prop(b,{x:1240,y:-280}),f:prop(f,{x:1240,y:-280}),g};}
const shellParts=sh=>[sh.b,sh.f,sh.g].filter(Boolean);
function dropShell(sh,at,dur=.5){for(const p of shellParts(sh))tl.fromTo(p,{y:-280},{y:520,duration:dur,ease:'power3.in',immediateRender:false},at);}
function liftShell(sh,at){for(const p of shellParts(sh))tl.to(p,{y:-380,duration:.4,ease:'power2.in'},at);}
const hookShells=[[AMBER,'#FBE3BC','Adapter'],[BERRY,'#F3D0E1','Decorator'],[GREEN,'#CDE9D5','Proxy']].map(([c,l,n])=>drawShell(c,l,n,{outer:null,inner:null}));
const shA=drawShell(AMBER,'#FBE3BC','Adapter',{outer:'round',inner:'square'});
const shP=drawShell(GREEN,'#CDE9D5','Proxy',{outer:'round',inner:'round',gate:true});
const shellSpark=prop(sparks(L.front,10,70,112),{x:1220,y:300,o:0});
/* 종이 (프린터 출력) */
const paperG=S('g',{},L.paper);S('rect',{x:-66,y:-170,width:132,height:170,rx:6,fill:'#fff',stroke:INK,'stroke-width':5},paperG);
for(let i=0;i<4;i++)S('rect',{x:-44,y:-144+i*28,width:i===3?50:88,height:9,rx:4,fill:INK,opacity:.3},paperG);
const paper=prop(paperG,{x:1240,y:560});
/* Client 플러그: 원점 = 프롱 끝 */
const plugG=S('g',{},L.plug);
S('rect',{x:-1800,y:-30,width:1660,height:60,fill:SLATE,stroke:INK,'stroke-width':7},plugG);
S('rect',{x:-150,y:-56,width:90,height:112,rx:16,fill:SLATE,stroke:INK,'stroke-width':7},plugG);
S('path',{d:PRONG.round,fill:'#DDE3EA',stroke:INK,'stroke-width':5},plugG);
T('Client',-560,13,{class:'mono','font-size':36,'text-anchor':'middle',fill:'#fff'},plugG);
const plugTag=T('Printer',-240,-50,{class:'mono','font-size':34,'text-anchor':'middle',fill:INK,style:'opacity:0'},plugG);

  let cz=1;for(const k in viewCam)if(document.getElementById(k).style.visibility!=='hidden'){cz=viewCam[k].z;break;}

    const pt=c.path.getPointAtLength(c.L*c.p);c.g.setAttribute('transform',`translate(${pt.x} ${pt.y-64})`);c.g.setAttribute('opacity',c.o);}
  for(const [gi,g] of gates.entries()){let lit=false;for(const c of cards){if(c.o<=0||(gi===1&&c.k===0))continue;if(Math.abs(c.p*c.L-g.len)<70)lit=true;}g.c.setAttribute('fill',lit?LIT:'#fff');}
}
