  <script>
    (function () {
      const $ = (id) => document.getElementById("st04-" + id);
      const q = (cls) => Array.from($("stage").getElementsByClassName(cls));
      const tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0–3s): kicker + per-word headline (content-length sequencing), box rises in ----
      tl.fromTo($("box"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 0.1);
      tl.fromTo($("btn"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.8);
      tl.fromTo($("kicker"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);
      // dynamic-content-sequencing: each word's start precomputed from its length
      const BASE = 0.22, SEC_PER_CHAR = 0.06;
      let t = 0.55;
      q("st04-word").forEach((w) => {
        tl.fromTo(w, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, t);
        t += BASE + w.textContent.length * SEC_PER_CHAR;
      });

      [$("arc1"), $("arc2"), $("mark")].forEach((p) => {
        const len = p.getTotalLength() * 1.05;
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
      });

      // press-release-spring (subtle): linear press, soft back.out release, adjacent positions
      function press(at) {
        const PRESS_DUR = 0.16;
        tl.to($("btn"), { scale: 0.95, backgroundColor: "#ECE3D4", boxShadow: "0 1px 2px rgba(20,20,19,0.06), 0 1px 4px rgba(20,20,19,0.03)", duration: PRESS_DUR, ease: "power1.in" }, at);
        tl.to($("btn"), { scale: 1, backgroundColor: "#EFE9DE", boxShadow: "0 1px 3px rgba(20,20,19,0.08), 0 4px 16px rgba(20,20,19,0.04)", duration: 0.6, ease: "back.out(1.4)" }, at + PRESS_DUR);
      }
      // card flip: rotateX out, swap face at the edge-on moment, rotateX in
      function flip(at, from, to) {
        tl.fromTo($("card"), { rotationX: 0 }, { rotationX: 90, duration: 0.22, ease: "power2.in", immediateRender: false }, at);
        tl.set(from, { opacity: 0 }, at + 0.22);
        tl.set(to, { opacity: 1 }, at + 0.22);
        tl.fromTo($("card"), { rotationX: -90 }, { rotationX: 0, duration: 0.32, ease: "power2.out", immediateRender: false }, at + 0.22);
      }

      // ---- Scene 2 (3.0–6.5s): press → "동전을 넣으세요"; coin in; card transitions itself (coral arrow) ----
      press(3.1);
      tl.fromTo($("res1"), { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 3.3);
      tl.fromTo($("coin"), { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 4.5);
      tl.fromTo($("dot1"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 4.95);
      tl.to($("arc1"), { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 5.0);
      tl.fromTo($("head1"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 5.6);
      tl.fromTo($("lbl1"), { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 5.5);
      flip(5.75, $("face-a"), $("face-b"));

      // ---- Scene 3 (6.5–10.0s): same call, different result; card returns along its own second arrow; code reveals ----
      press(6.6);
      tl.to($("res1"), { y: -14, opacity: 0, duration: 0.3, ease: "power2.in" }, 6.8);
      tl.fromTo($("res2"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 7.0);
      tl.fromTo($("dot2"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 7.25);
      tl.to($("arc2"), { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 7.3);
      tl.fromTo($("head2"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 7.9);
      tl.fromTo($("lbl2"), { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 7.8);
      flip(8.0, $("face-b"), $("face-a"));
      tl.to($("coin"), { opacity: 0.3, duration: 0.4, ease: "power1.out" }, 8.1); // coin spent

      tl.fromTo($("code"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 8.4);
      q("st04-line").forEach((l, i) => {
        tl.fromTo(l, { x: -12, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 8.75 + i * 0.35);
      });

      // ---- Scene 4 (10.0–15.0s): signal tags fill left→right; third pill gets a hairline scribble marker; hold ----
      q("st04-tag").forEach((p, i) => {
        tl.fromTo(p, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 10.3 + i * 0.4);
      });
      tl.to($("mark"), { strokeDashoffset: 0, duration: 0.8, ease: "power1.inOut" }, 11.7);
      tl.to({}, { duration: 0.01 }, 14.99); // pin timeline length to the 15s window

      window.__timelines = window.__timelines || {};
      window.__timelines["04-state"] = tl;
    })();
  </script>
