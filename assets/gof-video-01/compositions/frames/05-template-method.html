    (function () {
      const R = document.querySelector('[data-composition-id="05-template-method"]');
      const $ = (s) => R.querySelector(s);
      const $$ = (s) => Array.from(R.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // dynamic-content-sequencing: start times pre-computed once from content length
      function seq(texts, t0, base, perChar) {
        let t = t0;
        return texts.map((s) => { const st = t; t += base + s.length * perChar; return st; });
      }

      // svg-path-draw setup: measured lengths
      const drawPaths = [$("#tm05-bracket"), $("#tm05-inherit-line"), $("#tm05-inherit-head")];
      drawPaths.forEach((p) => {
        const len = p.getTotalLength() * 1.05;
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      });
      $("#tm05-inherit-head").style.fillOpacity = 0;

      // ---- Scene 1 (0–3s): kicker + headline, Ramen box, cells left→right ----
      const [kT, hT] = seq([$("#tm05-kicker").textContent.trim(), $("#tm05-headline").textContent], 0.15, 0.35, 0.025);
      tl.fromTo("#tm05-ramen", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.05);
      tl.fromTo("#tm05-kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, kT);
      tl.fromTo("#tm05-headline", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, hT);
      tl.fromTo("#tm05-card", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, hT + 0.6);

      const steps = $$(".tm05-step");
      const methods = $$(".tm05-method");
      const arrows = $$(".tm05-arrow");
      const cellT = seq(steps.map((c) => c.textContent.trim()), 0.7, 0.25, 0.06);
      steps.forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, cellT[i]);
        tl.fromTo(methods[i], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, cellT[i] + 0.1);
        if (i > 0) tl.fromTo(arrows[i - 1], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, cellT[i] - 0.1);
      });

      // ---- Scene 2 (3–6.5s): final lock, child box, inheritance arrow draws up ----
      tl.to("#tm05-bracket", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 2.7);
      tl.fromTo("#tm05-final", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.0);
      tl.fromTo(["#tm05-shin", "#tm05-soup"], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 3.9);
      tl.to("#tm05-inherit-line", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 4.7);
      tl.to("#tm05-inherit-head", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 5.05);
      tl.to("#tm05-inherit-head", { fillOpacity: 1, duration: 0.2, ease: "power1.out" }, 5.4);
      tl.fromTo("#tm05-inherit-label", { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 5.45);

      // ---- Scene 3 (6.5–10s): 매운 스프 travels into the slot; code reveals line by line ----
      tl.to("#tm05-soup", { y: -323, duration: 0.9, ease: "power2.inOut" }, 6.6);
      tl.to(["#tm05-abstract", "#tm05-soup-ph"], { opacity: 0, duration: 0.2, ease: "power1.out" }, 7.3);
      const lineT = [7.0, 7.35, 7.6, 7.85, 8.5, 8.75, 9.1];
      $$(".tm05-line").forEach((l, i) => {
        tl.fromTo(l, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, lineT[i]);
      });

      // ---- Scene 4 (10–14s): signal tags fill, then hold still ----
      $$(".tm05-tag").forEach((t, i) => {
        tl.fromTo(t, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 10.0 + i * 0.5);
      });

      tl.set({}, {}, 14);
      window.__timelines = window.__timelines || {};
      window.__timelines["05-template-method"] = tl;
    })();
  </script>
