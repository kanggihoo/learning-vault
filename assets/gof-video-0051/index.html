<!--
  GoF 3/6 — Observer · Mediator · Chain of Responsibility · Command 판별 explainer (70초, 16:9, 무음 + VO 대본 별도).
  주인공: 요청 봉투. 네 패턴은 "봉투가 가는 길의 모양"으로 갈린다.
    Observer  : 채널에서 봉투가 복사되어 구독자 전원에게 동시에 (1:N 방송)
    Mediator  : 공항 탑다운 — 비행기끼리의 그물(15선)이 관제탑 하나로 정리되고, 봉투는 늘 탑을 거친다
    Chain     : 결재 라인 측면 — 300만 원 봉투가 대리 → 과장에서 멈춘다, 부장에는 가지 않는다
    Command   : 봉투가 펼쳐져 주문서(객체)가 된다 — 리모컨에 끼워 실행, history에 쌓고 pop해서 undo
    리캡      : 판별 레일 ① 1:N 방송? ② 허브 경유? ③ 넘기는 사슬?
  더블클릭으로 열기. 자동재생 + 루프, R 다시, Space 일시정지. ?debug=1 스크럽, ?clean=1 export용.
  모든 시각 요소는 tl.time()의 순수 함수.
-->

const place=(g,x,y,s=1,r=0,o=1)=>{g.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${s})`);g.setAttribute('opacity',o);};
function render(){const t=tl.time();
  for(const p of props){p.el.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.r}) scale(${p.s})`);p.el.setAttribute('opacity',p.o);}
  for(const c of cams){const z=c.z*(1+.006*Math.sin(t*.9));c.g.setAttribute('transform',`translate(960 540) scale(${z}) translate(${-c.cx} ${-c.cy})`);}
  for(const b of blurs){if(b.v>.25){b.g.setAttribute('stdDeviation',b.axis==='y'?`${b.v*.12} ${b.v}`:b.axis==='x'?`${b.v} ${b.v*.08}`:`${b.v} ${b.v}`);b.el.style.filter=`url(#${b.id})`;}else b.el.style.filter='none';}
  let cz=1;for(const k in viewCam)if(document.getElementById(k).style.visibility!=='hidden'){cz=viewCam[k].z;break;}
  grid.style.transform=`scale(${(1+.022*Math.sin(t*.8))*(1+(cz-1)*.18)}) translate(${Math.sin(t*.21)*18}px,${Math.cos(t*.17)*14}px)`;
  bl1.style.transform=`translate(${Math.sin(t*.31)*90}px,${Math.cos(t*.27)*60}px)`;bl2.style.transform=`translate(${Math.cos(t*.23)*80}px,${Math.sin(t*.29)*70}px)`;
  /* Observer: 원본 봉투 → 복사본이 전원에게 동시에 → 도착하면 화면 점등 */
  {let hv=0,hs=0;for(const b of BC)if(t>=b-.9&&t<b){hv=1;hs=ease((t-b+.9)/.4);}
    place(oHero,560,470,.75*hs,0,hv);
    oCopies.forEach((g,k)=>{let o=0,x=0,y=0;for(const b of BC)if(t>=b&&t<b+1){const u=ease(t-b);o=1;x=lerp(600,PH[k][0]-70,u);y=lerp(500,PH[k][1],u);}place(g,x,y,.5,0,o);});
    phones.forEach((ph,k)=>{let pu=0;for(const b of BC)if(t>=b+1)pu=Math.max(pu,Math.exp(-(t-b-1)*1.4));ph.lit.setAttribute('opacity',pu);ph.inner.setAttribute('transform',`scale(${1+.14*pu})`);});}
  /* Mediator: 비행기 공전, 그물선 → 바큇살, 봉투는 늘 탑을 거친다 */
  {const P=planes.map((p,k)=>planeAt(k,t));
    planes.forEach((p,k)=>{let f=0;for(const m of MSG){const e=m.t0+m.d1+m.h+m.d2;if(m.b===k&&t>=e)f=Math.max(f,Math.exp(-(t-e)*1.5));}
      p.body.setAttribute('fill',f>.05?MED:'#fff');place(p.g,P[k].x,P[k].y,p.s*(1+.12*f),P[k].h,p.s>0?1:0);});
    pairs.forEach(([a,b],i)=>{const l=meshL[i];l.setAttribute('x1',P[a].x);l.setAttribute('y1',P[a].y);l.setAttribute('x2',P[b].x);l.setAttribute('y2',P[b].y);l.setAttribute('stroke-dashoffset',1-net.mesh);l.style.opacity=net.meshO;});
    spokeL.forEach((l,k)=>{l.setAttribute('x1',960);l.setAttribute('y1',560);l.setAttribute('x2',P[k].x);l.setAttribute('y2',P[k].y);l.setAttribute('stroke-dashoffset',1-net.spoke);});
    let mo=0,mx=0,my=0,pulse=0;
    for(const m of MSG){const t1=m.t0+m.d1,t2=t1+m.h,t3=t2+m.d2;
      if(t>=m.t0&&t<t1){const u=ease((t-m.t0)/m.d1);mo=1;mx=lerp(P[m.a].x,960,u);my=lerp(P[m.a].y,560,u);}
      else if(t>=t1&&t<t2){mo=1;mx=960;my=560;pulse=Math.sin((t-t1)/m.h*Math.PI);}
      else if(t>=t2&&t<t3){const u=ease((t-t2)/m.d2);mo=1;mx=lerp(960,P[m.b].x,u);my=lerp(560,P[m.b].y,u);}}
    place(mEnv,mx,my,.55,0,mo);towerRing.setAttribute('transform',`scale(${1+.22*pulse})`);}
  /* Command: 선풍기 각도 = 켜져 있던 시간의 적분 (끄면 감속) */
  {const w=760,on=clamp(t,FAN_ON,FAN_OFF)-FAN_ON,dec=t>FAN_OFF?(1-Math.exp(-(t-FAN_OFF)*3))/3:0;fanBlades.setAttribute('transform',`rotate(${w*(on+dec)})`);}
  /* 레일: 지나간 자리에 색 궤적, 게이트 통과 순간 점등 */
  for(const c of riders){trails[c.k].e.setAttribute('stroke-dashoffset',trails[c.k].L*(1-c.p));
    const pt=c.path.getPointAtLength(c.L*c.p);c.g.setAttribute('transform',`translate(${pt.x} ${pt.y-98})`);c.g.setAttribute('opacity',c.o);}
  gates.forEach((g,gi)=>{let lit=false;for(const c of riders){if(c.o<=0||!c.pass.includes(gi))continue;if(Math.abs(c.p*c.L-g.len)<70)lit=true;}g.c.setAttribute('fill',lit?LIT:'#fff');});
}
gsap.ticker.add(render);

/* ---------- 컨트롤: 자동재생 + 루프, 플레이어 없음. ?debug=1 스크럽, ?clean=1 export ---------- */
const q=new URLSearchParams(location.search);
const start=()=>tl.play(0);
tl.eventCallback('onComplete',start);
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);render();},play:start};
window.OPENER.seekFrame=t=>{window.OPENER.seek(t);return Promise.resolve();};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
  gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
document.fonts.ready.then(()=>{render();window.OPENER.ready=true;if(!q.has('clean'))start();});
</script>
