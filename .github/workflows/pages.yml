name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp -r lessons reference assets figures _site/
          python3 - <<'EOF'
          import glob, os, re, html
          def title(p):
              t = open(p, encoding="utf-8", errors="ignore").read()
              m = re.search(r"<title>(.*?)</title>", t, re.S)
              return html.escape(m.group(1).strip()) if m else os.path.basename(p)
          out = ["<!doctype html><html lang='ko'><meta charset='utf-8'>",
                 "<meta name='viewport' content='width=device-width,initial-scale=1'>",
                 "<title>Learning Vault</title>",
                 "<style>body{font:16px/1.7 system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}</style>",
                 "<h1>Learning Vault</h1>"]
          for d, name in (("lessons", "Lessons"), ("reference", "Reference")):
              out.append(f"<h2>{name}</h2><ul>")
              for p in sorted(glob.glob(f"{d}/*.html")):
                  out.append(f"<li><a href='{p}'>{os.path.basename(p)[:-5]}</a> - {title(p)}</li>")
              out.append("</ul>")
          open("_site/index.html", "w", encoding="utf-8").write("\n".join(out))
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
